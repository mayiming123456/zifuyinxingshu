function decodePayload(payload, info, password){
  var decryptP=Promise.resolve(payload);
  if(info.encrypted){
    if(!password)return Promise.resolve({type:'encrypted'});
    decryptP=decryptRaw(payload,password);
  }

  return decryptP.then(function(dec){
    if(dec===null)return {type:'wrong-password'};
    if(info.compression==='none')return { bytes:dec, encrypted:info.encrypted };
    return doDecompress(dec,info.compression).then(function(raw){
      return { bytes:raw, encrypted:info.encrypted };
    }).catch(function(){ return {type:'decompress-failed'}; });
  }).then(function(r){
    if(r.type)return r;
    var bytes=r.bytes;
    var compTag;
    if(info.compression==='none')compTag='<span style="color:var(--fg-secondary)">未压缩</span>';
    else compTag='<span style="color:var(--blue)">'+algoDisplayName(info.compression)+'</span>';

    if(info.gbk){
      return gbkDecode(bytes).then(function(text){
        if(text && looksLikeText(text)){
          return {
            type:'plain', text:text,
            encrypted:info.encrypted,
            compressed:info.compression!=='none',
            algoName:algoDisplayName(info.compression),
            extraNote:'文本编码 <strong>GBK</strong> · '+compTag
          };
        }
        return {type:'wrong-password'};
      });
    }else{
      var text=tryDecodeUtf8(bytes);
      if(text && looksLikeText(text)){
        return {
          type:'plain', text:text,
          encrypted:info.encrypted,
          compressed:info.compression!=='none',
          algoName:algoDisplayName(info.compression),
          extraNote:compTag
        };
      }
      return {type:'wrong-password'};
    }
  });
}

function tryDecodeV1(bytes, password){
  if(!bytes||bytes.length===0)return Promise.resolve(null);
  var first=bytes[0];

  function handleEncrypted(algo){
    if(!password)return Promise.resolve({type:'encrypted'});
    return decryptRaw(bytes.slice(1), password).then(function(plainBytes){
      if(!plainBytes)return {type:'wrong-password'};
      if(algo){
        return doDecompress(plainBytes, algo).then(function(raw){
          var text=tryDecodeUtf8(raw);
          if(text && looksLikeText(text)){
            return {type:'plain', text:text, encrypted:true, compressed:true, algoName:algoDisplayName(algo), extraNote:'旧格式'};
          }
          return {type:'wrong-password'};
        }).catch(function(){ return {type:'decompress-failed'}; });
      }else{
        var text=tryDecodeUtf8(plainBytes);
        if(text && looksLikeText(text)){
          return {type:'plain', text:text, encrypted:true, compressed:false, extraNote:'旧格式'};
        }
        return {type:'wrong-password'};
      }
    });
  }

  if(first===MARK_ENC_BR)return handleEncrypted('brotli');
  if(first===MARK_ENC_GZ)return handleEncrypted('gzip');
  if(first===MARK_ENC_ZS)return handleEncrypted('zstd');
  if(first===MARK_ENC)return handleEncrypted(null);
  if(first===MARK_PLAIN_BR || first===MARK_PLAIN_GZ || first===MARK_PLAIN_ZS){
    var algo2=(first===MARK_PLAIN_BR)?'brotli':(first===MARK_PLAIN_ZS)?'zstd':'gzip';
    return doDecompress(bytes.slice(1), algo2).then(function(raw){
      var text=tryDecodeUtf8(raw);
      if(text && looksLikeText(text)){
        return {type:'plain', text:text, encrypted:false, compressed:true, algoName:algoDisplayName(algo2), extraNote:'旧格式'};
      }
      return null;
    }).catch(function(){ return null; });
  }
  var text=tryDecodeUtf8(bytes);
  if(text && looksLikeText(text)){
    return Promise.resolve({type:'plain', text:text, encrypted:false, compressed:false, extraNote:'旧格式'});
  }
  return Promise.resolve(null);
}

function tryDecodeWith(text, method, scheme, password){
  var bytes=hiddenCharsToBytes(text, method, scheme);
  if(!bytes||bytes.length===0)return Promise.resolve(null);

  if(bytes[0]===MARK_V2 && bytes.length>=2){
    var info=parseMeta(bytes[1]);
    if(info.method!==method)return Promise.resolve(null);
    return decodePayload(bytes.slice(2), info, password);
  }
  if(method!=='standard')return Promise.resolve(null);
  return tryDecodeV1(bytes, password);
}

btnDecode.addEventListener('click',function(){
  if(btnDecode.classList.contains('loading'))return;
  var paste=inPaste.value;
  var password=inPasswordExtract.value;
  if(!paste){ toast('请粘贴文本'); return; }

  btnDecode.classList.add('loading','spin');
  btnDecode.setAttribute('data-loading','处理中…');
  resetDecodeCopyBtn();

  var cps=Array.from(paste);
  var countExtremeOnly=0, countFe00Fe07=0, countFe08Fe0f=0, countLow=0, countStandard=0;
  for(var i=0;i<cps.length;i++){
    var ch=cps[i];
    if(isExtremeExclusiveChar(ch))countExtremeOnly++;
    else if(isHexChar(ch)){
      var cp=ch.codePointAt(0);
      if(cp>=0xFE08)countFe08Fe0f++;
      else countFe00Fe07++;
    }
    else if(isBase64LowChar(ch))countLow++;
    else if(ZW_ALL_SET.has(ch))countStandard++;
  }

  var hasFe = (countFe00Fe07 + countFe08Fe0f) > 0;

  var candidates=[];
  var sel=EXTRACT_OPTIONS[extractSchemeIdx];

  if(countExtremeOnly > 0){
    candidates.push({method:'extreme', scheme:null});
  }
  if(hasFe){
    candidates.push({method:'highdensity', scheme:null});
  }
  if(countLow > 0 && countFe00Fe07 > 0){
    candidates.push({method:'base64', scheme:null});
  }
  if(countExtremeOnly === 0 && hasFe && countFe08Fe0f === 0 && countFe00Fe07 > 0 && countLow === 0){
    candidates.push({method:'extreme', scheme:null});
  }
  /* 注意：变体方案用 U+FE00/FE01，在上面计数时会被 isHexChar 分支计入 countFe00Fe07
     而不是 countStandard；若只判断 countStandard，默认的变体方案在自动检测（以及
     手动指定标准方案）时会被整段跳过，导致「发现隐藏字符，但无法解析为有效内容」。
     因此只要存在 FE00~FE07 字符，就必须把标准方案的各字符集加入候选。 */
  if(countStandard > 0 || countFe00Fe07 > 0 || candidates.length === 0){
    if(sel.id==='auto'){
      var ordered=SCHEMES.slice().sort(function(a,b){
        return (a.id==='microdot'?1:0)-(b.id==='microdot'?1:0);
      });
      ordered.forEach(function(s){ candidates.push({method:'standard', scheme:s}); });
    }else{
      candidates.push({method:'standard', scheme:sel});
    }
  }

  var idx=0, sawEncrypted=false, sawWrongPassword=false, sawDecompressFailed=false, foundAnyChars=false, done=false;

  function tryNext(){
    if(done)return;
    if(idx>=candidates.length){
      done=true;
      btnDecode.classList.remove('loading','spin');
      if(sawEncrypted){
        renderStatus('warn','<strong>检测到已加密内容</strong>，请在上方输入密码后重试');
      }else if(sawDecompressFailed){
        renderStatus('error','<strong>解压失败</strong>：压缩库可能未能加载（请检查网络后重试），或内容已损坏');
      }else if(sawWrongPassword){
        renderStatus('error','<strong>密码错误</strong>，无法解密。请检查密码是否正确');
      }else if(foundAnyChars){
        renderStatus('error','发现隐藏字符，但无法解析为有效内容');
      }else{
        renderStatus('error','未发现有效的隐藏内容');
      }
      expandAndScroll(resDecode);
      return;
    }
    var cand=candidates[idx++];
    foundAnyChars=true;

    tryDecodeWith(paste, cand.method, cand.scheme, password).then(function(res){
      if(done)return;
      if(res && res.type==='plain'){
        done=true;
        btnDecode.classList.remove('loading','spin');
        var methodName, methodDesc;
        if(cand.method==='extreme'){ methodName='极高压缩比（8 bit/字符）'; methodDesc='U+FE00~FE0F + U+E0100~E01EF'; }
        else if(cand.method==='highdensity'){ methodName='高压缩比（4 bit/字符）'; methodDesc='U+FE00 ~ U+FE0F'; }
        else if(cand.method==='base64'){ methodName='Base64（6 bit/字符对）'; methodDesc='U+200B~U+2064 × U+FE00~FE07'; }
        else { methodName=cand.scheme.name; methodDesc=cand.scheme.desc; }
        var head='匹配方法：<strong>'+methodName+'</strong>（'+methodDesc+'）';
        var full=res.extraNote?head+' · '+res.extraNote:head;
        renderSuccess(res.text, full, res.encrypted, res.compressed, res.algoName, res.libTag);
        expandAndScroll(resDecode);
        return;
      }
      if(res && res.type==='encrypted')sawEncrypted=true;
      if(res && res.type==='wrong-password')sawWrongPassword=true;
      if(res && res.type==='decompress-failed')sawDecompressFailed=true;
      tryNext();
    }).catch(function(){ tryNext(); });
  }
  tryNext();
});

var lastDetectReport='';
btnDetect.addEventListener('click',function(){
  var text=inDetect.value;
  if(!text){ toast('请输入文本'); return; }

  var counts={};
  ZW_TYPES.forEach(function(t){ counts[t.code]=0; });
  var total=0, visible=0;
  var vizSegments=[], truncated=false, truncTarget=VIZ_LIMIT;
  var countExtreme=0, countHexExt=0, countHex=0, countBase64Low=0;

  for(var ch of text){
    total++;
    if(isExtremeExclusiveChar(ch))countExtreme++;
    else if(isHexChar(ch)){
      countHex++;
      var cp=ch.codePointAt(0);
      if(cp>=0xFE08)countHexExt++;
    }else if(isBase64LowChar(ch))countBase64Low++;

    if(total<=truncTarget){
      var info=ZW_MAP[ch];
      if(info){ counts[info.code]++; vizSegments.push({type:'zw',info:info}); }
      else{ visible++; vizSegments.push({type:'char',value:ch}); }
    }else{
      if(!truncated)truncated=true;
      var info2=ZW_MAP[ch];
      if(info2)counts[info2.code]++; else visible++;
    }
  }
  var hidden=total-visible;

  animateNum(statTotal,total); animateNum(statVisible,visible); animateNum(statHidden,hidden);
  statHidden.classList.toggle('hl',hidden>0);

  var tlHtml='', hasAny=false, tagIdx=0;
  var reportLines=['文字隐写检测报告','总字符：'+total,'可见字符：'+visible,'隐藏字符：'+hidden,'','隐藏字符明细：'];
  ZW_TYPES.forEach(function(t){
    var c=counts[t.code];
    if(c>0){
      hasAny=true;
      tlHtml+='<div class="tag" style="animation-delay:'+(tagIdx*0.06)+'s">'+
        '<span class="tag-dot" style="background:'+t.color+'"></span>'+
        '<span class="tag-name">'+escapeHtml(t.name)+'</span>'+
        '<span class="tag-code">'+t.code+'</span>'+
        '<span class="tag-count">×'+c+'</span></div>';
      reportLines.push('· '+t.name+' ('+t.code+') × '+c);
      tagIdx++;
    }
  });

  if(countHex > 0){
    hasAny=true;
    tlHtml+='<div class="tag" style="background:rgba(175,82,222,.14)">'+
      '<span class="tag-dot" style="background:#AF52DE"></span>'+
      '<span class="tag-name" style="color:#AF52DE">高压缩比（4 bit）字符</span>'+
      '<span class="tag-code">U+FE00~FE0F</span>'+
      '<span class="tag-count">×'+countHex+'</span></div>';
    reportLines.push('· 高压缩比（4 bit）字符 × '+countHex);
  }
  if(countExtreme > 0){
    hasAny=true;
    tlHtml+='<div class="tag" style="background:rgba(255,149,0,.14)">'+
      '<span class="tag-dot" style="background:#FF9500"></span>'+
      '<span class="tag-name" style="color:#FF9500">极高压缩比（8 bit）字符</span>'+
      '<span class="tag-code">U+E0100~E01EF</span>'+
      '<span class="tag-count">×'+countExtreme+'</span></div>';
    reportLines.push('· 极高压缩比（8 bit）字符 × '+countExtreme);
  }
  if(countBase64Low > 0 && countHex > 0 && countExtreme === 0){
    tlHtml+='<div class="tag" style="background:var(--blue-light)">'+
      '<span class="tag-dot" style="background:#0A84FF"></span>'+
      '<span class="tag-name" style="color:#0A84FF">可能为 Base64（6 bit/字符对）</span>'+
      '<span class="tag-code">LOW×'+countBase64Low+' HIGH×'+Math.min(countHex,countBase64Low)+'</span>'+
      '</div>';
    reportLines.push('','可能为 Base64 方法（低位 '+countBase64Low+' 个 + 高位 '+Math.min(countHex,countBase64Low)+' 个）');
  }

  typeList.innerHTML=hasAny?tlHtml:'<span class="tags-empty">未检测到隐藏字符</span>';

  if(!hasAny){
    vizText.innerHTML='<span class="viz-empty">文本中不包含隐藏字符</span>';
  }else{
    var vHtml='', zwIdx=0;
    for(var j=0;j<vizSegments.length;j++){
      var seg=vizSegments[j];
      if(seg.type==='char')vHtml+=escapeHtml(seg.value);
      else{
        var ti=seg.info;
        vHtml+='<span class="zw-chip" style="background:'+ti.color+'20;color:'+ti.color+
          ';animation-delay:'+Math.min(zwIdx*0.02,0.8)+'s">'+ti.code+'</span>';
        zwIdx++;
      }
    }
    if(truncated)vHtml+='<span class="viz-more">… 内容过长，仅显示前 '+VIZ_LIMIT+' 个字符</span>';
    vizText.innerHTML=vHtml;
  }

  lastDetectReport=reportLines.join('\n');
  btnCopyReport.style.display=hasAny?'inline-flex':'none';
  expandAndScroll(resDetect);
});

btnCopyReport.addEventListener('click',function(){
  if(!lastDetectReport)return;
  copyText(lastDetectReport).then(function(ok){
    if(ok)toast('检测报告已复制');
    else toast('复制失败，请长按报告手动复制');
  });
});

function animateNum(el,target){
  var start=parseInt(el.textContent,10)||0;
  if(start===target)return;
  var dur=380,t0=null;
  function step(ts){
    if(!t0)t0=ts;
    var p=Math.min((ts-t0)/dur,1);
    var eased=1-Math.pow(1-p,3);
    el.textContent=Math.round(start+(target-start)*eased);
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

var topBtnVisible=false;
function updateTopBtn(){
  var show=window.pageYOffset>400;
  if(show!==topBtnVisible){ topBtnVisible=show; btnTop.classList.toggle('visible',show); }
}
window.addEventListener('scroll',updateTopBtn,{passive:true});
btnTop.addEventListener('click',function(){
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
});

document.addEventListener('keydown',function(e){
  if(e.isComposing)return;
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){
    var active=document.querySelector('.panel.active');
    if(!active)return;
    e.preventDefault();
    if(active.id==='pHide')btnEncode.click();
    else if(active.id==='pExtract')btnDecode.click();
    else if(active.id==='pDetect')btnDetect.click();
  }
});
inPasswordHide.addEventListener('keydown',function(e){
  if(e.key==='Enter'){ e.preventDefault(); btnEncode.click(); }
});
inPasswordExtract.addEventListener('keydown',function(e){
  if(e.key==='Enter'){ e.preventDefault(); btnDecode.click(); }
});

if(methodPref!=='standard'){
  $('rowSchemeHide').classList.add('disabled');
}

document.body.style.paddingBottom='env(safe-area-inset-bottom)';

})();
</script>
