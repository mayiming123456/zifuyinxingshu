<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>文字隐写术</title>
<style>
:root{
  --bg:#F2F2F6;--bg-elevated:#FFFFFF;--card:rgba(255,255,255,.92);
  --fg:#000000;--fg-secondary:#3C3C4399;--fg-tertiary:#3C3C4366;
  --separator:#3C3C431A;--separator-light:#3C3C430D;
  --blue:#007AFF;--blue-light:#007AFF1A;--blue-press:#0056D6;
  --green:#34C759;--green-soft:#34C75914;--orange:#FF9500;--orange-soft:#FF950014;
  --red:#FF3B30;--red-soft:#FF3B3014;--teal:#30B0C7;--purple:#AF52DE;
  --radius-sm:10px;--radius-md:14px;--radius-lg:20px;--radius-xl:26px;--radius-pill:999px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04), 0 1px 0 rgba(0,0,0,.02);
  --shadow-md:0 4px 16px rgba(0,0,0,.06), 0 1px 0 rgba(0,0,0,.03);
  --shadow-lg:0 12px 40px rgba(0,0,0,.10);
  --shadow-button:0 6px 20px -4px rgba(0,122,255,.38);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",SFMono-Regular,ui-monospace,Menlo,monospace;
  --ease-out:cubic-bezier(.22,1,.36,1);--ease-spring:cubic-bezier(.32,1.35,.45,1);--ease-ios:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000;--bg-elevated:#1C1C1E;--card:rgba(28,28,30,.90);
    --fg:#FFFFFF;--fg-secondary:#EBEBF599;--fg-tertiary:#EBEBF54D;
    --separator:#54545866;--separator-light:#54545833;
    --blue:#0A84FF;--blue-light:#0A84FF1A;--blue-press:#409CFF;
    --green:#30D158;--green-soft:#30D1581A;--orange:#FF9F0A;--orange-soft:#FF9F0A1A;
    --red:#FF453A;--red-soft:#FF453A1A;--teal:#40CBD8;--purple:#BF5AF2;
    --shadow-sm:0 1px 2px rgba(0,0,0,.18), 0 1px 0 rgba(255,255,255,.04);
    --shadow-md:0 4px 16px rgba(0,0,0,.22), 0 1px 0 rgba(255,255,255,.03);
    --shadow-lg:0 12px 40px rgba(0,0,0,.35);
    --shadow-button:0 6px 20px -4px rgba(10,132,255,.35);
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:16px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
::-webkit-scrollbar{width:0;height:0}
.app{max-width:540px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));min-height:100vh}
.header{display:flex;align-items:center;gap:14px;padding:12px 2px 26px;animation:fadeUp .55s var(--ease-out) both}
.brand-icon{width:48px;height:48px;border-radius:var(--radius-md);background:linear-gradient(135deg,var(--blue),#5AC8FA);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow-button)}
.brand-icon svg{width:22px;height:22px}
.brand-text h1{font-size:28px;font-weight:700;letter-spacing:-.7px;line-height:1.1}
.brand-text p{font-size:13px;color:var(--fg-secondary);margin-top:4px;font-weight:500}
.tabbar{position:relative;display:flex;justify-content:center;margin-bottom:26px;animation:fadeUp .55s .05s var(--ease-out) both}
.tabbar-inner{display:inline-flex;position:relative;background:var(--card);border-radius:var(--radius-pill);padding:4px;box-shadow:var(--shadow-md);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.tab-btn{position:relative;z-index:1;padding:9px 22px;font-size:14px;font-weight:500;color:var(--fg-secondary);background:none;border:none;border-radius:var(--radius-pill);font-family:inherit;cursor:pointer;transition:color .28s var(--ease-out),transform .12s}
.tab-btn:active{transform:scale(.95)}
.tab-btn.active{color:#fff;font-weight:600}
.tab-glider{position:absolute;top:4px;left:4px;height:calc(100% - 8px);width:calc((100% - 8px)/3);background:var(--blue);border-radius:var(--radius-pill);box-shadow:0 2px 8px rgba(0,122,255,.35);transition:transform .4s var(--ease-spring);will-change:transform}
.panel{display:none}
.panel.active{display:block;animation:panelIn .4s var(--ease-out) both}
@keyframes panelIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);margin-bottom:16px;overflow:hidden;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);animation:fadeUp .5s .08s var(--ease-out) both}
.card>*{position:relative}
.card-row{display:flex;align-items:center;gap:12px;width:100%;padding:15px 18px;background:none;border:none;font-family:inherit;font-size:16px;color:var(--fg);text-align:left;cursor:pointer;transition:background .15s}
.card-row:active{background:var(--separator-light)}
.card-row:not(:last-child)::after{content:'';position:absolute;bottom:0;left:18px;right:18px;height:1px;background:var(--separator)}
.card-row.disabled{opacity:.4;pointer-events:none}
.row-label{font-weight:500;flex-shrink:0}
.row-value{margin-left:auto;font-size:15px;color:var(--fg-secondary);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:14px;height:14px;color:var(--fg-tertiary);flex-shrink:0;margin-left:4px}
.switch-track{margin-left:auto;width:48px;height:28px;border-radius:var(--radius-pill);background:var(--separator);position:relative;transition:background .25s;flex-shrink:0}
.switch-track::after{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:transform .28s var(--ease-spring)}
.switch-track.on{background:var(--green)}
.switch-track.on::after{transform:translateX(20px)}
.field{padding:16px 18px}
.field-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:600;color:var(--fg-secondary);text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px}
.field-title{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.field-hint{font-weight:500;color:var(--fg-tertiary);text-transform:none;letter-spacing:0;font-size:12px}
textarea,input[type=password]{width:100%;border:none;background:transparent;padding:0;font-family:inherit;font-size:17px;color:var(--fg);line-height:1.55;resize:none;outline:none;-webkit-appearance:none;caret-color:var(--blue)}
textarea::placeholder,input[type=password]::placeholder{color:var(--fg-tertiary)}
.password-wrap{display:flex;align-items:center;gap:8px;margin-top:2px}
.password-wrap input{min-width:0;letter-spacing:.6px}
.btn-eye{width:32px;height:32px;border-radius:50%;border:none;background:none;display:flex;align-items:center;justify-content:center;color:var(--fg-secondary);cursor:pointer;transition:background .15s,color .15s}
.btn-eye:active{background:var(--separator-light);color:var(--fg)}
.btn-eye svg{width:18px;height:18px;display:block}
.btn-eye .eye-off{display:none}
.btn-eye.revealed .eye{display:none}
.btn-eye.revealed .eye-off{display:block}
.field-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--separator-light)}
.field-count{font-size:12px;color:var(--fg-secondary);font-weight:500;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:var(--radius-pill);background:var(--separator-light);color:var(--fg-secondary)}
.badge.warn{background:var(--orange-soft);color:var(--orange)}
.badge.danger{background:var(--red-soft);color:var(--red)}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.purple{background:rgba(175,82,222,.14);color:var(--purple)}
.badge.blue{background:var(--blue-light);color:var(--blue)}
.btn-clear{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;background:none;border:none;border-radius:var(--radius-sm);color:var(--fg-tertiary);font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;transition:background .15s,color .15s,opacity .2s}
.btn-clear:active:not(:disabled){background:var(--separator-light);color:var(--fg-secondary)}
.btn-clear:disabled{opacity:0;pointer-events:none}
.icon-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;background:var(--blue-light);border:none;border-radius:var(--radius-pill);color:var(--blue);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:transform .12s,background .2s}
.icon-btn svg{width:12px;height:12px}
.icon-btn:active{transform:scale(.94)}
.icon-btn:disabled{opacity:.5}
.icon-btn.done{background:var(--green-soft);color:var(--green)}
.btn-primary{width:100%;padding:16px;border:none;border-radius:var(--radius-md);background:var(--blue);color:#fff;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:var(--shadow-button);transition:transform .12s,filter .2s,opacity .2s;animation:fadeUp .5s .12s var(--ease-out) both;position:relative;overflow:hidden}
.btn-primary:active:not(:disabled){transform:scale(.985);filter:brightness(.96)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;pointer-events:none}
.btn-primary.loading{color:transparent;pointer-events:none}
.btn-primary.loading::before{content:attr(data-loading);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:600}
.btn-primary.loading.spin::before{opacity:0}
.btn-primary.loading.spin::after{content:'';position:absolute;top:50%;left:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid rgba(255,255,255,.35);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.hint{display:flex;align-items:flex-start;gap:10px;margin:0 2px 16px;padding:12px 14px;border-radius:var(--radius-md);background:var(--card);box-shadow:var(--shadow-sm);font-size:13px;line-height:1.5;color:var(--fg-secondary);animation:fadeUp .5s .14s both}
.hint svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;color:var(--blue)}
.hint.ok{background:var(--green-soft);color:var(--green)}
.hint.ok svg{color:var(--green)}
.hint strong{font-weight:600;color:var(--fg)}
.result{display:grid;grid-template-rows:0fr;opacity:0;margin-top:0;margin-bottom:0;transition:grid-template-rows .45s var(--ease-ios),opacity .35s .05s,margin .35s}
.result.open{grid-template-rows:1fr;opacity:1;margin-top:18px;margin-bottom:16px}
.result-inner{overflow:hidden}
.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px 8px}
.result-title{font-size:13px;font-weight:600;color:var(--fg-secondary);display:flex;align-items:center;gap:8px}
.result-title::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--blue)}
.result-actions{display:flex;gap:8px}
.result-body{margin:6px 18px 14px;padding:14px 16px;background:var(--bg);border-radius:var(--radius-md);font-size:15px;line-height:1.6;word-break:break-all;user-select:all;min-height:52px;max-height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch;color:var(--fg)}
.result-stats{display:flex;gap:10px;flex-wrap:wrap;margin:0 18px 16px}
.stat-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--radius-pill);background:var(--separator-light);font-size:11.5px;font-weight:500;color:var(--fg-secondary)}
.stat-pill.hl{background:var(--blue-light);color:var(--blue)}
.stat-pill.warn{background:var(--orange-soft);color:var(--orange)}
.stat-pill.purple{background:rgba(175,82,222,.14);color:var(--purple)}
.stat-pill.gold{background:rgba(255,149,0,.14);color:var(--orange)}
.stat-pill.gray{background:var(--separator-light);color:var(--fg-secondary)}
.extracted{margin:16px 18px 12px;padding:16px 18px;background:var(--blue-light);border-radius:var(--radius-md);font-size:16px;line-height:1.55;word-break:break-all;user-select:all;animation:rise .4s var(--ease-spring) both}
.scheme-note{margin:0 18px 16px;font-size:12.5px;color:var(--fg-secondary);line-height:1.5}
.scheme-note strong{color:var(--blue);font-weight:600}
.status-card{display:flex;align-items:flex-start;gap:12px;margin:16px 18px 18px;padding:14px 16px;border-radius:var(--radius-md);font-size:14.5px;line-height:1.55;animation:rise .4s var(--ease-spring) both}
.status-card.error{background:var(--red-soft);color:var(--red)}
.status-card.warn{background:var(--orange-soft);color:var(--orange)}
.status-card.ok{background:var(--green-soft);color:var(--green)}
.status-icon{width:22px;height:22px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;margin-top:1px}
.status-card.error .status-icon{background:var(--red)}
.status-card.warn .status-icon{background:var(--orange)}
.status-card.ok .status-icon{background:var(--green)}
.status-text{font-weight:500}
.status-text strong{font-weight:700}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.metric{background:var(--card);border-radius:var(--radius-lg);padding:16px 4px;text-align:center;box-shadow:var(--shadow-sm);animation:pop .45s var(--ease-spring) both}
.metric:nth-child(2){animation-delay:.05s}
.metric:nth-child(3){animation-delay:.10s}
.stat-num,.metric-num{font-size:26px;font-weight:700;letter-spacing:-.7px;color:var(--fg);line-height:1;font-variant-numeric:tabular-nums}
.stat-num.hl,.metric-num.hl{color:var(--blue)}
.metric-label{font-size:11px;font-weight:600;color:var(--fg-secondary);margin-top:6px;text-transform:uppercase;letter-spacing:.3px}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:32px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;background:var(--card);border-radius:var(--radius-pill);box-shadow:var(--shadow-sm);font-size:12.5px;font-weight:500;animation:pop .32s var(--ease-spring) both}
.tag-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tag-name{color:var(--fg)}
.tag-code{font-family:var(--mono);font-size:10.5px;color:var(--fg-tertiary)}
.tag-count{font-weight:700;margin-left:2px;font-variant-numeric:tabular-nums}
.tags-empty{display:inline-flex;align-items:center;gap:8px;color:var(--fg-secondary);font-size:13px;line-height:32px}
.viz-wrap{margin-top:10px}
.viz{padding:14px 16px;background:var(--bg);border-radius:var(--radius-md);font-size:15px;line-height:2.4;word-break:break-all;max-height:280px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.zw-chip{display:inline-flex;align-items:center;justify-content:center;height:20px;padding:0 7px;border-radius:var(--radius-sm);font-size:9px;font-weight:700;font-family:var(--mono);margin:0 2px;vertical-align:middle;position:relative;top:-1px;animation:pop .3s var(--ease-spring) both}
.viz-empty{display:inline-flex;align-items:center;gap:8px;color:var(--fg-secondary);font-size:13.5px}
.viz-more{display:block;font-size:11.5px;color:var(--fg-secondary);margin-top:10px}
.sheet-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.sheet-overlay.open{opacity:1;visibility:visible}
.sheet{position:fixed;left:50%;bottom:0;z-index:101;width:min(100%,540px);background:var(--bg-elevated);border-radius:26px 26px 0 0;transform:translateX(-50%) translateY(104%);transition:transform .42s var(--ease-ios);max-height:80vh;display:flex;flex-direction:column;padding-bottom:calc(8px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg)}
.sheet.open{transform:translateX(-50%) translateY(0)}
.sheet-handle{width:38px;height:5px;border-radius:3px;background:var(--separator);margin:10px auto 4px;flex-shrink:0}
.sheet-title{padding:12px 20px 14px;text-align:center;font-size:13px;font-weight:600;color:var(--fg-secondary);border-bottom:1px solid var(--separator);flex-shrink:0}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0}
.sheet-opt{display:flex;align-items:center;gap:14px;width:100%;padding:15px 20px;background:none;border:none;cursor:pointer;font-family:inherit;text-align:left;position:relative;transition:background .15s}
.sheet-opt:active{background:var(--separator-light)}
.sheet-opt:not(:first-child)::before{content:'';position:absolute;top:0;left:20px;right:20px;height:1px;background:var(--separator)}
.opt-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.opt-name{font-size:16px;font-weight:500;color:var(--fg)}
.opt-desc{font-size:12px;color:var(--fg-secondary);font-family:var(--mono)}
.opt-note{font-size:12px;color:var(--fg-tertiary);line-height:1.4;margin-top:1px}
.opt-check{width:22px;height:22px;flex-shrink:0;color:var(--blue);opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s var(--ease-spring)}
.sheet-opt.selected .opt-check{opacity:1;transform:scale(1)}
.sheet-opt.selected .opt-name{color:var(--blue);font-weight:600}
.sheet-cancel{width:100%;padding:17px;background:none;border:none;border-top:1px solid var(--separator);font-size:16px;font-weight:600;color:var(--blue);font-family:inherit;cursor:pointer;flex-shrink:0;transition:background .15s}
.sheet-cancel:active{background:var(--separator-light)}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-20px) scale(.94);background:rgba(48,48,48,.92);color:#fff;-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);padding:11px 22px;border-radius:var(--radius-pill);font-size:14px;font-weight:500;white-space:nowrap;opacity:0;pointer-events:none;z-index:200;max-width:calc(100vw - 40px);overflow:hidden;text-overflow:ellipsis;box-shadow:var(--shadow-lg);transition:opacity .3s,transform .36s var(--ease-spring)}
.toast.visible{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.btn-top{position:fixed;right:calc(50% - 270px + 18px);bottom:calc(22px + env(safe-area-inset-bottom));z-index:50;width:44px;height:44px;border-radius:50%;border:none;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--fg-secondary);box-shadow:var(--shadow-md);cursor:pointer;opacity:0;visibility:hidden;transform:scale(.7) translateY(10px);transition:all .34s var(--ease-spring)}
@media(max-width:580px){.btn-top{right:18px}}
.btn-top.visible{opacity:1;visibility:visible;transform:scale(1) translateY(0)}
.btn-top:active{transform:scale(.9);color:var(--fg)}
.btn-top svg{width:18px;height:18px}
.foot{text-align:center;padding:22px 0 0}
.foot span{font-size:11px;color:var(--fg-tertiary);font-weight:500;line-height:1.7;display:block}
.file-progress{display:none;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;background:var(--blue-light);border-radius:var(--radius-sm);color:var(--blue);font-size:12px;font-weight:500}
.file-progress.show{display:flex}
.file-progress .spinner{width:13px;height:13px;border:2px solid rgba(0,122,255,.25);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
.paste-hint{display:flex;align-items:flex-start;gap:8px;margin-top:0;padding:0 12px;background:var(--orange-soft);border-radius:var(--radius-sm);color:var(--orange);font-size:12px;line-height:1.5;opacity:0;max-height:0;overflow:hidden;transition:opacity .3s,max-height .35s,margin-top .3s,padding .3s}
.paste-hint.show{opacity:1;max-height:120px;margin-top:10px;padding:10px 12px}
.paste-hint svg{width:14px;height:14px;flex-shrink:0;margin-top:2px}
.paste-hint strong{font-weight:700}
.pw-strength{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--separator-light);opacity:0;max-height:0;overflow:hidden;transition:all .25s}
.pw-strength.show{opacity:1;max-height:30px;margin-top:10px;padding-top:10px}
.pw-bars{display:flex;gap:4px;flex:1}
.pw-bar{flex:1;height:4px;border-radius:2px;background:var(--separator);transition:background .25s}
.pw-bar.weak{background:var(--red)}
.pw-bar.fair{background:var(--orange)}
.pw-bar.good{background:var(--teal)}
.pw-bar.strong{background:var(--green)}
.pw-label{font-size:11px;font-weight:600;min-width:40px;text-align:right;color:var(--fg-secondary)}
.pw-label.weak{color:var(--red)}
.pw-label.fair{color:var(--orange)}
.pw-label.good{color:var(--teal)}
.pw-label.strong{color:var(--green)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 5.5L20 9l-4.5 3.7L17 19l-5-3-5 3 1.5-6.3L4 9l5.6-1.5z"/></svg>
    </div>
    <div class="brand-text">
      <h1>文字隐写术</h1>
      <p>把秘密藏进看似平常的文字里</p>
    </div>
  </header>

  <nav class="tabbar" role="tablist">
    <div class="tabbar-inner">
      <div class="tab-glider" id="tabGlider"></div>
      <button class="tab-btn active" role="tab" aria-selected="true" data-tab="hide">隐藏</button>
      <button class="tab-btn" role="tab" aria-selected="false" data-tab="extract">提取</button>
      <button class="tab-btn" role="tab" aria-selected="false" data-tab="detect">检测</button>
    </div>
  </nav>

  <main>
    <section class="panel active" id="pHide" role="tabpanel">
      <div class="card">
        <div class="field">
          <label class="field-label" for="inCarrier">
            <span class="field-title">载体文本<span class="field-hint">表面上显示的文字</span></span>
            <button class="icon-btn" type="button" id="btnPasteCarrier">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              粘贴
            </button>
          </label>
          <textarea id="inCarrier" rows="3" placeholder="例如：今天天气真好"></textarea>
          <div class="field-footer">
            <span class="field-count" id="count_inCarrier">0 字</span>
            <button class="btn-clear" type="button" data-clear="inCarrier">清空</button>
          </div>
        </div>

        <button class="card-row" id="rowMethod" type="button">
          <span class="row-label">隐藏方法</span>
          <span class="row-value" id="valMethod">标准（1 bit/字符）</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="card-row" id="rowSchemeHide" type="button">
          <span class="row-label">编码方案</span>
          <span class="row-value" id="valSchemeHide">变体方案</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="card-row" id="rowTextEncoding" type="button">
          <span class="row-label">文本编码</span>
          <span class="row-value" id="valTextEncoding">UTF-8</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="card-row" id="rowCompress" type="button">
          <span class="row-label">压缩算法</span>
          <span class="row-value" id="valCompress">自动</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="card-row" id="rowForceCompress" type="button" aria-pressed="false">
          <span class="row-label">即使压缩后变大也压缩</span>
          <span class="switch-track" id="switchForce"></span>
        </button>

        <div class="field">
          <label class="field-label" for="inPasswordHide">
            <span class="field-title">加密密码<span class="field-hint">可选，留空则不加密</span></span>
          </label>
          <div class="password-wrap">
            <input id="inPasswordHide" type="password" placeholder="输入密码以加密隐藏内容" autocomplete="off">
            <button class="btn-eye" type="button" data-target="inPasswordHide" aria-label="切换密码可见">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <div class="pw-strength" id="pwStrengthHide">
            <div class="pw-bars"><div class="pw-bar"></div><div class="pw-bar"></div><div class="pw-bar"></div><div class="pw-bar"></div></div>
            <span class="pw-label" id="pwLabelHide"></span>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="inSecret">
            <span class="field-title">隐藏内容<span class="field-hint">要藏进去的信息</span></span>
            <button class="icon-btn" type="button" id="btnPasteSecret">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              粘贴
            </button>
          </label>
          <textarea id="inSecret" rows="3" placeholder="例如：这是一段秘密"></textarea>
          <div class="field-footer">
            <span class="field-count" id="count_inSecret">0 字</span>
            <button class="btn-clear" type="button" data-clear="inSecret">清空</button>
          </div>
        </div>
      </div>

      <div class="hint" id="compressHint" hidden></div>

      <button class="btn-primary" id="btnEncode" type="button" data-loading="处理中…">生成隐写文本</button>

      <div class="result" id="resEncode">
        <div class="result-inner">
          <div class="card">
            <div class="result-head">
              <span class="result-title">生成结果</span>
              <div class="result-actions">
                <button class="icon-btn" id="btnDownload" type="button">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
                  <span>下载</span>
                </button>
                <button class="icon-btn" id="btnCopyEnc" type="button">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  <span id="copyLabel">复制</span>
                </button>
              </div>
            </div>
            <div class="result-body" id="outEncoded"></div>
            <div class="result-stats" id="statsEnc"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel" id="pExtract" role="tabpanel">
      <div class="card">
        <div class="field">
          <label class="field-label" for="inPaste">
            <span class="field-title">粘贴文本<span class="field-hint">可能含有隐藏内容的文本</span></span>
            <div style="display:flex;gap:6px">
              <button class="icon-btn" type="button" id="btnImport">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
                导入
              </button>
              <button class="icon-btn" type="button" id="btnPaste">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                粘贴
              </button>
            </div>
          </label>
          <textarea id="inPaste" rows="4" placeholder="将隐写文本粘贴到这里，或点击「导入」选择 .txt 文件"></textarea>
          <div class="file-progress" id="fileProgress">
            <span class="spinner"></span>
            <span id="fileProgressText">读取文件中…</span>
          </div>
          <div class="field-footer">
            <span class="field-count" id="count_inPaste">0 字</span>
            <button class="btn-clear" type="button" data-clear="inPaste">清空</button>
          </div>
        </div>

        <button class="card-row" id="rowSchemeExtract" type="button">
          <span class="row-label">提取方案</span>
          <span class="row-value" id="valSchemeExtract">自动检测</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>

        <div class="field">
          <label class="field-label" for="inPasswordExtract">
            <span class="field-title">解密密码<span class="field-hint">如果内容已加密</span></span>
          </label>
          <div class="password-wrap">
            <input id="inPasswordExtract" type="password" placeholder="输入密码以解密隐藏内容" autocomplete="off">
            <button class="btn-eye" type="button" data-target="inPasswordExtract" aria-label="切换密码可见">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
      </div>

      <button class="btn-primary" id="btnDecode" type="button" data-loading="处理中…">解析提取</button>

      <div class="result" id="resDecode">
        <div class="result-inner">
          <div class="card">
            <div class="result-head">
              <span class="result-title">提取结果</span>
              <div class="result-actions">
                <button class="icon-btn" id="btnCopyDec" type="button" style="display:none">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  <span id="copyDecLabel">复制</span>
                </button>
              </div>
            </div>
            <div id="outDecoded"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel" id="pDetect" role="tabpanel">
      <div class="card">
        <div class="field">
          <label class="field-label" for="inDetect">
            <span class="field-title">输入文本<span class="field-hint">检测不可见字符与微符号</span></span>
            <button class="icon-btn" type="button" id="btnPasteDetect">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              粘贴
            </button>
          </label>
          <textarea id="inDetect" rows="4" placeholder="粘贴任意文本，检测其中是否含有隐藏字符"></textarea>
          <div class="field-footer">
            <span class="field-count" id="count_inDetect">0 字</span>
            <button class="btn-clear" type="button" data-clear="inDetect">清空</button>
          </div>
        </div>
      </div>

      <button class="btn-primary" id="btnDetect" type="button" data-loading="检测中…">开始检测</button>

      <div class="result" id="resDetect">
        <div class="result-inner">
          <div class="metrics">
            <div class="metric"><div class="stat-num" id="statTotal">0</div><div class="metric-label">总字符</div></div>
            <div class="metric"><div class="stat-num" id="statVisible">0</div><div class="metric-label">可见字符</div></div>
            <div class="metric"><div class="stat-num hl" id="statHidden">0</div><div class="metric-label">隐藏字符</div></div>
          </div>
          <div class="tags" id="typeList"></div>
          <div class="card viz-wrap">
            <div class="result-head">
              <span class="result-title">字符可视化</span>
              <button class="icon-btn" id="btnCopyReport" type="button" style="display:none">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                复制报告
              </button>
            </div>
            <div class="viz" id="vizText"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span>Unicode 不可见字符 · AES-GCM 加密 · Brotli / ZSTD / gzip / deflate-raw / 不压缩 · GBK 编码 · 4 种密度（1/3/4/8 bit）</span>
  </footer>
</div>

<button class="btn-top" id="btnTop" type="button" aria-label="回到顶部">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<div class="sheet-overlay" id="sheetOverlay" aria-hidden="true"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="sheetTitle">
  <div class="sheet-handle" aria-hidden="true"></div>
  <div class="sheet-title" id="sheetTitle">选择方案</div>
  <div class="sheet-body" id="sheetBody"></div>
  <button class="sheet-cancel" id="sheetCancel" type="button">取消</button>
</div>

<div class="toast" id="toast" role="status"></div>

<input type="file" id="fileInput" accept=".txt,text/plain" style="display:none">

<script>
(function(){
'use strict';

var SCHEMES=[
  { id:'variant',  name:'变体方案', zero:'\uFE00', one:'\uFE01', desc:'U+FE00 / U+FE01', note:'标准变体选择符 · 无字形不渲染' },
  { id:'microdot', name:'微点方案', zero:'\u0387', one:'\u2027', desc:'U+0387 / U+2027', note:'两种视觉一致的极小圆点' },
  { id:'stealth',  name:'隐蔽方案', zero:'\u200B', one:'\u200D', desc:'U+200B / U+200D', note:'连接符变体 · 规避基础过滤' },
  { id:'safe',     name:'安全方案', zero:'\u2060', one:'\u2061', desc:'U+2060 / U+2061', note:'格式字符 · 多数平台不过滤' },
  { id:'deep',     name:'深度隐蔽', zero:'\u2062', one:'\u2063', desc:'U+2062 / U+2063', note:'数学不可见运算符 · 检测罕见' },
  { id:'extreme',  name:'极端方案', zero:'\u2064', one:'\u034F', desc:'U+2064 / U+034F', note:'跨 Unicode 区块混用' }
];
var EXTRACT_OPTIONS=[{ id:'auto', name:'自动检测', desc:'依次尝试全部方法', note:'自动识别加密、压缩、密度' }].concat(SCHEMES);

var COMPRESS_OPTIONS=[
  { id:'auto',         name:'自动',         desc:'实测竞选 · 最小输出',           note:'本地 deflate-raw/gzip 零成本必跑；载荷 ≥128 B 加跑 Brotli/ZSTD，谁小用谁' },
  { id:'brotli',       name:'Brotli',       desc:'外部库 · 长文本压缩率最高',     note:'统一走外部库（约 400KB）· 长文本首选' },
  { id:'zstd',         name:'ZSTD',         desc:'外部库 · 压缩率与速度均衡',     note:'原生不支持时自动加载外部库（约 500KB）' },
  { id:'gzip',         name:'gzip',         desc:'原生 · 速度最快',               note:'使用浏览器原生 gzip，含 18 字节头部' },
  { id:'deflate-raw',  name:'deflate-raw',  desc:'原生 · 无头无校验 · 小文本首选', note:'浏览器原生 · 剥掉 zlib 头与 Adler-32 校验 · 小文本比 gzip 更省' },
  { id:'none',         name:'不压缩',        desc:'完全关闭压缩',                  note:'直接嵌入原始字节 · 解码最快 · 无任何冗余' }
];

var METHOD_OPTIONS=[
  { id:'standard',    name:'标准（1 bit/字符）',        desc:'2 种符号 · 8 字符/字节',   note:'使用「编码方案」的字符集，兼容性最好' },
  { id:'base64',      name:'Base64（6 bit/字符对）',    desc:'8×8 字符对 · 2.67 字符/字节', note:'低位组+高位组配对，64 种状态，完全避开冷门扩展区' },
  { id:'highdensity', name:'高压缩比（4 bit/字符）',     desc:'16 字符 · 2 字符/字节',   note:'U+FE00~U+FE0F，同样信息量字符数减半' },
  { id:'extreme',     name:'极高压缩比（8 bit/字符）',   desc:'256 字符 · 1 字符/字节',  note:'U+FE00~FE0F + U+E0100~E01EF，最省字符数但兼容性稍差' }
];

var TEXT_ENCODING_OPTIONS=[
  { id:'utf8', name:'UTF-8', desc:'通用编码 · 中文 3 字节', note:'兼容所有语言与 emoji' },
  { id:'gbk',  name:'GBK',   desc:'简体中文编码 · 中文 2 字节', note:'首次使用需加载外部库（约 100KB）。仅支持简体中文' }
];

var ZW_TYPES=[
  { char:'\u200B', name:'零宽空格',     code:'U+200B', color:'#0E8A8A' },
  { char:'\u200C', name:'零宽不连接',   code:'U+200C', color:'#B25000' },
  { char:'\u200D', name:'零宽连接',     code:'U+200D', color:'#8B5CF6' },
  { char:'\uFEFF', name:'零宽不换行',   code:'U+FEFF', color:'#D12D2D' },
  { char:'\u2060', name:'单词连接符',   code:'U+2060', color:'#0A6EBD' },
  { char:'\u2061', name:'函数应用',     code:'U+2061', color:'#B3347A' },
  { char:'\u2062', name:'隐形乘号',     code:'U+2062', color:'#A16207' },
  { char:'\u2063', name:'隐形逗号',     code:'U+2063', color:'#2F8F46' },
  { char:'\u2064', name:'隐形加号',     code:'U+2064', color:'#8A6A45' },
  { char:'\u034F', name:'组合连接符',   code:'U+034F', color:'#5B5BD6' },
  { char:'\uFE00', name:'变体选择符 1', code:'U+FE00', color:'#0E7490' },
  { char:'\uFE01', name:'变体选择符 2', code:'U+FE01', color:'#7E22CE' },
  { char:'\u0387', name:'希腊间隔点',   code:'U+0387', color:'#9A3412' },
  { char:'\u2027', name:'连字分隔点',   code:'U+2027', color:'#57606E' }
];
var ZW_MAP={}, ZW_ALL_SET=new Set();
ZW_TYPES.forEach(function(t){ ZW_MAP[t.char]=t; ZW_ALL_SET.add(t.char); });

var HEX_CHARS=[
  '\uFE00','\uFE01','\uFE02','\uFE03','\uFE04','\uFE05','\uFE06','\uFE07',
  '\uFE08','\uFE09','\uFE0A','\uFE0B','\uFE0C','\uFE0D','\uFE0E','\uFE0F'
];
var HEX_CHAR_MAP={};
HEX_CHARS.forEach(function(ch,i){ HEX_CHAR_MAP[ch]=i; });

var DENSE256=[];
(function(){
  for(var i=0xFE00;i<=0xFE0F;i++)DENSE256.push(String.fromCodePoint(i));
  for(var j=0xE0100;j<=0xE01EF;j++)DENSE256.push(String.fromCodePoint(j));
})();
var DENSE256_MAP={};
DENSE256.forEach(function(ch,i){ DENSE256_MAP[ch]=i; });

var BASE64_LOW=['\u200B','\u200C','\u200D','\u2060','\u2061','\u2062','\u2063','\u2064'];
var BASE64_HIGH=['\uFE00','\uFE01','\uFE02','\uFE03','\uFE04','\uFE05','\uFE06','\uFE07'];
var BASE64_LOW_MAP={}, BASE64_HIGH_MAP={};
BASE64_LOW.forEach(function(ch,i){ BASE64_LOW_MAP[ch]=i; });
BASE64_HIGH.forEach(function(ch,i){ BASE64_HIGH_MAP[ch]=i; });
var BASE64_LOW_SET=new Set(BASE64_LOW);
var BASE64_HIGH_SET=new Set(BASE64_HIGH);

function isHexChar(ch){ if(!ch)return false; var cp=ch.codePointAt(0); return cp>=0xFE00&&cp<=0xFE0F; }
function isExtremeExclusiveChar(ch){ if(!ch)return false; var cp=ch.codePointAt(0); return cp>=0xE0100&&cp<=0xE01EF; }
function isBase64LowChar(ch){ return BASE64_LOW_SET.has(ch); }

function multiSourceImport(sources, validate, name){
  var list=sources.slice();
  function tryNext(){
    if(list.length===0)return Promise.reject(new Error(name+' 所有 CDN 均不可用'));
    var url=list.shift();
    console.log('[CDN] 尝试加载 '+name+'：'+url);
    return import(/* @vite-ignore */ url)
      .then(function(mod){
        var candidate=mod;
        if(mod && mod.default!==undefined && mod.default!==null)candidate=mod.default;
        return Promise.resolve(candidate);
      })
      .then(function(api){ return validate(api); })
      .catch(function(err){
        var msg=err&&err.message?err.message:String(err);
        console.warn('[CDN] '+name+' 加载失败 '+url+'：'+msg);
        return tryNext();
      });
  }
  return tryNext();
}

function loadExternalBrotli(){
  if(externalBrotli)return Promise.resolve(externalBrotli);
  if(externalBrotliLoading)return externalBrotliLoading;
  externalBrotliLoading=multiSourceImport(BROTLI_SOURCES, function(b){
    if(!b||typeof b.compress!=='function'||typeof b.decompress!=='function')throw new Error('缺少 compress/decompress');
    return brotliSmokeTest(b);
  },'Brotli').then(function(b){
    externalBrotli=b;
    try{ console.log('[Brotli] 模块就绪'); }catch(e){}
    updateCompressHint();
    return b;
  }).catch(function(e){ externalBrotliLoading=null; throw e; });
  return externalBrotliLoading;
}

function loadExternalZstd(){
  if(externalZstd)return Promise.resolve(externalZstd);
  if(externalZstdLoading)return externalZstdLoading;
  externalZstdLoading=multiSourceImport(ZSTD_SOURCES, function(api){
    if(!api||typeof api!=='object')throw new Error('模块导出不是对象');
    var init=api.init, cf=api.compress, df=api.decompress;
    if((typeof cf!=='function'||typeof df!=='function')&&api.default){
      init=init||api.default.init; cf=cf||api.default.compress; df=df||api.default.decompress;
    }
    if(typeof init!=='function')throw new Error('缺少 init');
    if(typeof cf!=='function'||typeof df!=='function')throw new Error('缺少 compress/decompress');
    return init().then(function(){
      return zstdSmokeTest(cf,df).then(function(){ return {compress:cf,decompress:df}; });
    });
  },'ZSTD').then(function(a){ externalZstd=a; updateCompressHint(); return a; })
    .catch(function(e){ externalZstdLoading=null; throw e; });
  return externalZstdLoading;
}

    return iconv;

function coerceToUint8Array(out, label){
  if(out instanceof Uint8Array)return out;
  if(out instanceof ArrayBuffer)return new Uint8Array(out);
  if(out && out.buffer instanceof ArrayBuffer){
    return new Uint8Array(out.buffer, out.byteOffset||0, out.byteLength||out.length||0);
  }
  if(out && typeof out.length==='number'){
    var arr=new Uint8Array(out.length);
    for(var i=0;i<out.length;i++)arr[i]=out[i]&0xFF;
    return arr;
  }
  throw new Error(label+' 返回类型异常：'+Object.prototype.toString.call(out));
}

/* ══════════ 外部库冒烟测试 ══════════
   仅检查「有没有 compress/decompress 函数」是不够的：esm.sh 对 brotli-wasm 的坏构建
   函数存在但 wasm 实例化 glue 丢失，一调用就抛 "(void 0) is not a function"。
   因此在接受任何一个外部库之前，先用极小样本跑一次压缩→解压回环，坏构建会被直接跳过。 */
var SMOKE_SAMPLE=new Uint8Array([0x73,0x74,0x65,0x67,0x6F,0x5F,0x7A,0x77]); // "stego_zw"
function smokeRoundtrip(compressFn, decompressFn, label){
  var c;
  try{ c=compressFn(SMOKE_SAMPLE); }
  catch(syncErr){ return Promise.reject(syncErr); }
  return Promise.resolve(c).then(function(cmp){
    var cb=coerceToUint8Array(cmp, label+' 冒烟测试');
    return Promise.resolve(decompressFn(cb));
  }).then(function(back){
    var bb=coerceToUint8Array(back, label+' 冒烟测试');
    if(bb.length!==SMOKE_SAMPLE.length)throw new Error(label+' 冒烟测试失败：解压长度不一致');
    for(var i=0;i<SMOKE_SAMPLE.length;i++){
      if(bb[i]!==SMOKE_SAMPLE[i])throw new Error(label+' 冒烟测试失败：解压内容不一致');
    }
  });
}
function brotliSmokeTest(b){
  return smokeRoundtrip(function(x){ return b.compress(x); }, function(x){ return b.decompress(x); }, 'Brotli')
    .then(function(){ return b; });
}
function zstdSmokeTest(cf, df){
  return smokeRoundtrip(function(x){ return cf(x); }, function(x){ return df(x); }, 'ZSTD');
}

function compressNative(bytes, algo){
  try{
    var cs=new CompressionStream(algo);
    var writer=cs.writable.getWriter();
    writer.write(bytes); writer.close();
    return collectStream(cs.readable);
  }catch(e){ return Promise.reject(e); }
}
function decompressNative(bytes, algo){
  try{
    var ds=new DecompressionStream(algo);
    var writer=ds.writable.getWriter();
    writer.write(bytes); writer.close();
    return collectStream(ds.readable);
  }catch(e){ return Promise.reject(e); }
}
function collectStream(readable){
  var reader=readable.getReader();
  var chunks=[], total=0;
  function pump(){
    return reader.read().then(function(result){
      if(result.done){
        var out=new Uint8Array(total), offset=0;
        for(var i=0;i<chunks.length;i++){ out.set(chunks[i], offset); offset+=chunks[i].length; }
        return out;
      }
      chunks.push(result.value); total+=result.value.length;
      return pump();
    });
  }
  return pump();
}

function doCompress(bytes, algo){
  if(!algo)return Promise.reject(new Error('no-algo'));
  if(algo==='gzip'){
    if(!nativeSupport.gzip)return Promise.reject(new Error('no-gzip'));
    return compressNative(bytes,'gzip');
  }
  if(algo==='deflate-raw'){
    if(!nativeSupport.deflateRaw)return Promise.reject(new Error('no-deflate-raw'));
    return compressNative(bytes,'deflate-raw');
  }
  if(algo==='brotli'){
    return loadExternalBrotli().then(function(b){
      if(!b||typeof b.compress!=='function')throw new Error('Brotli 模块未就绪');
      var result;
      try{ result=b.compress(bytes); }
      catch(syncErr){ return Promise.reject(syncErr); }
      return Promise.resolve(result).then(function(out){
        return coerceToUint8Array(out, 'Brotli 压缩');
      });
    });
  }
  if(algo==='zstd'){
    if(nativeSupport.zstd)return compressNative(bytes,'zstd');
    return loadExternalZstd().then(function(z){
      var result=z.compress(bytes);
      return Promise.resolve(result).then(function(out){
        return coerceToUint8Array(out, 'ZSTD 压缩');
      });
    });
  }
  return Promise.reject(new Error('unknown-algo'));
}
function doDecompress(bytes, algo){
  if(algo==='gzip'){
    if(!nativeSupport.gzip)return Promise.reject(new Error('no-gzip'));
    return decompressNative(bytes,'gzip');
  }
  if(algo==='deflate-raw'){
    if(!nativeSupport.deflateRaw)return Promise.reject(new Error('no-deflate-raw'));
    return decompressNative(bytes,'deflate-raw');
  }
  if(algo==='brotli'){
    return loadExternalBrotli().then(function(b){
      if(!b||typeof b.decompress!=='function')throw new Error('Brotli 模块未就绪');
      var result;
      try{ result=b.decompress(bytes); }
      catch(syncErr){ return Promise.reject(syncErr); }
      return Promise.resolve(result).then(function(out){
        return coerceToUint8Array(out, 'Brotli 解压');
      });
    });
  }
  if(algo==='zstd'){
    if(nativeSupport.zstd)return decompressNative(bytes,'zstd');
    return loadExternalZstd().then(function(z){
      var result=z.decompress(bytes);
      return Promise.resolve(result).then(function(out){
        return coerceToUint8Array(out, 'ZSTD 解压');
      });
    });
  }
  return Promise.reject(new Error('unknown-algo'));
}

function deriveKey(password, salt){
  var pwBytes=new TextEncoder().encode(password);
  return crypto.subtle.importKey('raw',pwBytes,{name:'PBKDF2'},false,['deriveKey'])
    .then(function(baseKey){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:PBKDF2_ITER,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
    });
}
function encryptRaw(plainBytes, password){
  var salt=crypto.getRandomValues(new Uint8Array(SALT_LEN));
  var iv=crypto.getRandomValues(new Uint8Array(IV_LEN));
  return deriveKey(password, salt).then(function(key){
    return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,plainBytes);
  }).then(function(cipherBuf){
    var cipher=new Uint8Array(cipherBuf);
    var out=new Uint8Array(SALT_LEN+IV_LEN+cipher.length);
    out.set(salt,0); out.set(iv,SALT_LEN); out.set(cipher,SALT_LEN+IV_LEN);
    return out;
  });
}
function decryptRaw(data, password){
  if(data.length < SALT_LEN+IV_LEN+TAG_LEN)return Promise.resolve(null);
  var salt=data.slice(0,SALT_LEN);
  var iv=data.slice(SALT_LEN,SALT_LEN+IV_LEN);
  var cipher=data.slice(SALT_LEN+IV_LEN);
  return deriveKey(password,salt).then(function(key){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,cipher);
  }).then(function(plainBuf){ return new Uint8Array(plainBuf); })
    .catch(function(){ return null; });
}

function cleanText(str){

    if(ZW_ALL_SET.has(ch))return false;

  }).join('');

function looksLikeText(s){
  if(!s||!s.length)return false;
  var printable=0;
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    if(c===9||c===10||c===13){ printable++; continue; }
    if(c>=32&&c!==127)printable++;
  }
  return printable/s.length>0.8;
}

function debounce(fn, wait){

    var ctx=this,args=arguments;

function formatCount(n){
  if(n<1000)return n+' 字';
  if(n<10000)return (n/1000).toFixed(1)+' 千字';
  return (n/10000).toFixed(1)+' 万字';
}
function formatBytes(n){
  if(n<1024)return n+' B';
  if(n<1024*1024)return (n/1024).toFixed(1)+' KB';
  return (n/1024/1024).toFixed(2)+' MB';
}
function decodeFileBytes(bytes){
  if(!bytes||bytes.length===0)return '';
  if(bytes.length>=3 && bytes[0]===0xEF && bytes[1]===0xBB && bytes[2]===0xBF){
    try{ return new TextDecoder('utf-8').decode(bytes.slice(3)); }catch(e){ return null; }
  }
  if(bytes.length>=2 && bytes[0]===0xFF && bytes[1]===0xFE){ try{ return new TextDecoder('utf-16le').decode(bytes.slice(2)); }catch(e){} }
  if(bytes.length>=2 && bytes[0]===0xFE && bytes[1]===0xFF){ try{ return new TextDecoder('utf-16be').decode(bytes.slice(2)); }catch(e){} }
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(bytes); }
  catch(e){ try{ return new TextDecoder('utf-8').decode(bytes); }catch(e2){ return null; } }
}

}

function evaluatePassword(pw){
  if(!pw)return {score:0,label:''};
  var len=Array.from(pw).length;
  var hasLower=/[a-z]/.test(pw),hasUpper=/[A-Z]/.test(pw);
  var hasDigit=/[0-9]/.test(pw),hasSymbol=/[^A-Za-z0-9]/.test(pw);
  var variety=(hasLower?1:0)+(hasUpper?1:0)+(hasDigit?1:0)+(hasSymbol?1:0);
  var score=0;
  if(len>=4)score=1;
  if(len>=8&&variety>=2)score=2;
  if(len>=10&&variety>=3)score=3;
  if(len>=12&&variety>=4)score=4;
  return {score:score,label:['','弱','一般','较好','强'][score]};
}
function updatePwStrength(pwEl,wrapEl,labelEl){
  var res=evaluatePassword(pwEl.value);
  if(!pwEl.value){ wrapEl.classList.remove('show'); labelEl.textContent=''; labelEl.className='pw-label'; return; }
  wrapEl.classList.add('show');
  var bars=wrapEl.querySelectorAll('.pw-bar');
  var cls='';
  if(res.score===1)cls='weak';
  else if(res.score===2)cls='fair';
  else if(res.score===3)cls='good';
  else if(res.score>=4)cls='strong';
  bars.forEach(function(b,i){ b.className='pw-bar'; if(i<res.score)b.classList.add(cls); });
  labelEl.textContent=res.label; labelEl.className='pw-label '+cls;
}

var autoGrowPending={};
function autoGrow(t){
  if(!t.offsetParent&&t.scrollHeight===0)return;
  if(autoGrowPending[t.id])return;
  autoGrowPending[t.id]=true;
  requestAnimationFrame(function(){
    autoGrowPending[t.id]=false;
    t.style.height='auto';
    t.style.height=Math.min(t.scrollHeight,320)+'px';
  });
}
function countChars(str){ return Array.from(str).length; }

function bitsPerChar(method){
  if(method==='extreme')return 8;
  if(method==='highdensity')return 4;
  if(method==='base64')return 3;
  return 1;
}

function computeCapacityPct(secretLen,carrierLen){
  if(!secretLen||!carrierLen)return 0;
  var algo=resolveAlgoForEncode();
  var ratio=estimateCompressRatio(algo);
  var bytesPerChar=(textEncodingPref==='gbk')?2:3;
  var estBytes=secretLen*bytesPerChar*ratio;
  var bpc=bitsPerChar(methodPref);
  var estChars=Math.ceil(estBytes*8/bpc);
  var cap=carrierLen*MAX_ZW_PER_CHAR;
  return Math.min(100,Math.round(estChars/cap*100));
}

function updateFieldState(ta){
  var countEl=$('count_'+ta.id);
  if(!countEl)return;
  var len=countChars(ta.value);
  var html='<span>'+formatCount(len)+'</span>';
  countEl.classList.remove('warn','danger');

  if(ta.id==='inSecret'){
    var carrierLen=countChars(inCarrier.value);
    if(carrierLen===0){
      html+=' <span class="badge">请先填写载体文本</span>';
    }else{
      var pct=computeCapacityPct(len,carrierLen);
      var clsName=pct>90?'danger':(pct>60?'warn':'ok');
      var label=pct>90?'载体偏短':(pct>60?'接近上限':'容量充裕');
      html+=' <span class="badge '+clsName+'">'+label+' '+pct+'%</span>';
    }
    var algo=resolveAlgoForEncode();
    if(len>=100 && algo)html+=' <span class="badge">'+(algo==='auto'?'自动压缩':algoDisplayName(algo)+' 压缩')+'</span>';
    if(textEncodingPref==='gbk')html+=' <span class="badge">GBK</span>';
    if(methodPref==='base64')html+=' <span class="badge blue">Base64·6bit</span>';
    else if(methodPref==='highdensity')html+=' <span class="badge purple">4-bit</span>';
    else if(methodPref==='extreme')html+=' <span class="badge gold">8-bit</span>';
    if(len>ENCODE_CHAR_LIMIT*0.9)countEl.classList.add('danger');
    else if(len>ENCODE_CHAR_LIMIT*0.7)countEl.classList.add('warn');
  }
  countEl.innerHTML=html;

  var clearBtn=document.querySelector('.btn-clear[data-clear="'+ta.id+'"]');
  if(clearBtn)clearBtn.disabled=(ta.value.length===0);
}

  compressHint.hidden=false;
  compressHint.className='hint';

  var extraNotes=[];
  if(textEncodingPref==='gbk'){
    if(externalIconv)extraNotes.push('已加载外部 <strong>GBK 编码库</strong>');
    else if(externalIconvLoading)extraNotes.push('正在加载外部 <strong>GBK 编码库</strong>…');
    else extraNotes.push('GBK 首次使用时会自动加载外部库（约 100KB）');
  }
  if(methodPref==='base64')extraNotes.push('使用 <strong>Base64 方法（6 bit/字符对）</strong>');
  else if(methodPref==='highdensity')extraNotes.push('使用<strong>高压缩比方法（4 bit/字符）</strong>');
  else if(methodPref==='extreme')extraNotes.push('使用<strong>极高压缩比方法（8 bit/字符）</strong>');

  var forceNote=forceCompress?'（已开启「即使变大也压缩」）':'';
  var compNote='';
  if(compressPref==='none'){
    extraNotes.push('<strong style="color:var(--fg-secondary)">不压缩：直接嵌入原始字节</strong>');
    compNote='压缩已关闭';
  }else if(compressPref==='deflate-raw'){
    compNote='将使用原生 <strong>deflate-raw</strong> 压缩（无 zlib 头无校验和，小文本更省）'+forceNote;
    if(!nativeSupport.deflateRaw)extraNotes.push('<strong style="color:var(--red)">当前浏览器不支持 deflate-raw</strong>');
  }else if(compressPref==='brotli'){
    if(externalBrotli)compNote='已加载外部 <strong>Brotli 库</strong>'+forceNote;
    else if(externalBrotliLoading)compNote='正在加载外部 <strong>Brotli 库</strong>…';
    else compNote='首次压缩时将自动加载外部 Brotli 库（约 400KB）'+forceNote;
  }else if(compressPref==='zstd'){
    if(nativeSupport.zstd)compNote='将使用原生 <strong>ZSTD</strong> 压缩'+forceNote;
    else if(externalZstd)compNote='已加载外部 <strong>ZSTD 库</strong>'+forceNote;
    else if(externalZstdLoading)compNote='正在加载外部 <strong>ZSTD 库</strong>…';
    else compNote='原生不支持 ZSTD，首次压缩时将自动加载外部库（约 500KB）'+forceNote;
  }else if(compressPref==='gzip'){
    if(nativeSupport.gzip)compNote='将使用原生 <strong>gzip</strong> 压缩'+forceNote;
    else compNote='当前浏览器不支持 gzip，将不压缩直接嵌入';
  }else{
    var autoLocal=[];

    if(nativeSupport.zstd)autoLocal.push('ZSTD');
    var libNote=(externalBrotli||externalZstd)?'外部库已就绪':'载荷 ≥'+AUTO_EXTERNAL_MIN_BYTES+' B 时加跑外部库';
    compNote='自动模式：实测竞选最小输出 · 本地 <strong>'+(autoLocal.length?autoLocal.join(' / '):'无')+'</strong> 零成本必跑 · '+libNote+forceNote;
  }

  var allNotes=[compNote].concat(extraNotes);
  compressHint.innerHTML=infoSvg+'<span>'+allNotes.join(' · ')+'。</span>';
  if(compressPref==='auto' && textEncodingPref==='utf8' && methodPref==='standard'){

/* ══════════ 编码：4 种方法 ══════════ */
function bytesToZeroWidth(bytes,zero,one){
  var parts=new Array(bytes.length*8), p=0;
  for(var i=0;i<bytes.length;i++){
    var bin=bytes[i].toString(2);
    while(bin.length<8)bin='0'+bin;
    for(var j=0;j<8;j++)parts[p++]=(bin.charCodeAt(j)===48)?zero:one;
  }
  return parts.join('');
}
function zeroWidthToBytes(zw,zero,one){
  var len=zw.length, bits=new Array(len), count=0;
  for(var i=0;i<len;i++){
    var c=zw.charAt(i);
    if(c===zero)bits[count++]='0';
    else if(c===one)bits[count++]='1';
  }
  if(count===0||count%8!==0)return null;
  var bytes=new Uint8Array(count/8);
  for(var k=0;k<bytes.length;k++){
    var base=k*8, b=0;
    for(var m=0;m<8;m++)b=(b<<1)|(bits[base+m]==='1'?1:0);
    bytes[k]=b;
  }
  return bytes;
}

function bytesToBase64Chars(bytes){
  var bits=[];
  for(var i=0;i<bytes.length;i++)for(var j=7;j>=0;j--)bits.push((bytes[i]>>j)&1);
  var paddingBits=(6-(bits.length%6))%6;
  for(var p=0;p<paddingBits;p++)bits.push(0);
  var groups=[paddingBits];
  for(var k=0;k<bits.length;k+=6){
    var v=0;
    for(var m=0;m<6;m++)v=(v<<1)|bits[k+m];
    groups.push(v);
  }
  var out=new Array(groups.length*2);
  for(var g=0;g<groups.length;g++){
    out[g*2]=BASE64_LOW[groups[g]&7];
    out[g*2+1]=BASE64_HIGH[(groups[g]>>3)&7];
  }
  return out.join('');
}
function base64CharsToBytes(text){
  var cps=Array.from(text);
  var pairs=[], i=0;
  while(i<cps.length){
    var ch=cps[i];
    if(isBase64LowChar(ch)){
      var j=i+1;
      while(j<cps.length && !isBase64HighChar(cps[j]) && !isBase64LowChar(cps[j]))j++;
      if(j<cps.length && isBase64HighChar(cps[j])){
        pairs.push((BASE64_HIGH_MAP[cps[j]]<<3)|BASE64_LOW_MAP[ch]);
        i=j+1;
      }else{ i++; }
    }else{ i++; }
  }
  if(pairs.length < 2)return null;
  var paddingBits=pairs[0];
  if(paddingBits > 5)return null;
  var bits=[];
  for(var v=1;v<pairs.length;v++)for(var b=5;b>=0;b--)bits.push((pairs[v]>>b)&1);
  if(paddingBits>0 && bits.length>=paddingBits){
    bits=bits.slice(0,bits.length-paddingBits);
  }
  var outLen=Math.floor(bits.length/8);
  if(outLen===0)return null;
  var out=new Uint8Array(outLen);
  for(var k=0;k<outLen;k++){
    var byte=0;
    for(var m=0;m<8;m++)byte=(byte<<1)|bits[k*8+m];
    out[k]=byte;
  }
  return out;
}

function bytesToHighDensity(bytes){
  var parts=new Array(bytes.length*2), p=0;
  for(var i=0;i<bytes.length;i++){
    var b=bytes[i];
    parts[p++]=HEX_CHARS[(b>>4)&0x0F];
    parts[p++]=HEX_CHARS[b&0x0F];
  }
  return parts.join('');
}
function highDensityToBytes(text){
  var nibbles=[], cps=Array.from(text);
  for(var i=0;i<cps.length;i++){
    var n=HEX_CHAR_MAP[cps[i]];
    if(n!==undefined)nibbles.push(n);
  }
  if(nibbles.length===0||nibbles.length%2!==0)return null;
  var bytes=new Uint8Array(nibbles.length/2);
  for(var k=0;k<bytes.length;k++)bytes[k]=(nibbles[k*2]<<4)|nibbles[k*2+1];
  return bytes;
}

function bytesToExtreme(bytes){
  var parts=new Array(bytes.length);
  for(var i=0;i<bytes.length;i++)parts[i]=DENSE256[bytes[i]];
  return parts.join('');
}
function extremeToBytes(text){
  var bytes=[], cps=Array.from(text);
  for(var i=0;i<cps.length;i++){
    var b=DENSE256_MAP[cps[i]];
    if(b!==undefined)bytes.push(b);
  }
  if(bytes.length===0)return null;
  return new Uint8Array(bytes);
}

function bytesToHiddenChars(bytes, method, scheme){
  if(method==='extreme')return bytesToExtreme(bytes);
  if(method==='highdensity')return bytesToHighDensity(bytes);
  if(method==='base64')return bytesToBase64Chars(bytes);
  return bytesToZeroWidth(bytes, scheme.zero, scheme.one);
}
function hiddenCharsToBytes(text, method, scheme){
  if(method==='extreme')return extremeToBytes(text);
  if(method==='highdensity')return highDensityToBytes(text);
  if(method==='base64')return base64CharsToBytes(text);
  var zw='', cps=Array.from(text);
  for(var i=0;i<cps.length;i++)if(cps[i]===scheme.zero||cps[i]===scheme.one)zw+=cps[i];
  if(!zw||zw.length%8!==0)return null;
  return zeroWidthToBytes(zw, scheme.zero, scheme.one);
}

/* ══════════ meta 编解码 ══════════
   bit 7:   deflate-raw 标志
   bit 6-5: 方法 (0=standard, 1=base64, 2=highdensity, 3=extreme)
   bit 4-3: 压缩 (00=none, 01=gzip, 10=brotli, 11=zstd)
   bit 2:   编码 (UTF-8/GBK)
   bit 1:   加密
   bit 0:   保留
*/
var METHOD_MAP={ standard:0, base64:1, highdensity:2, extreme:3 };
var METHOD_REV=['standard','base64','highdensity','extreme'];
var COMP_MAP={ none:0, gzip:1, brotli:2, zstd:3 };
var COMP_REV=['none','gzip','brotli','zstd'];

function buildMeta(method, compression, gbk, encrypted){
  var m=0;
  m|=(METHOD_MAP[method]||0)<<5;
  if(compression==='deflate-raw')m|=0x80;
  else m|=(COMP_MAP[compression]||0)<<3;
  if(gbk)m|=0x04;
  if(encrypted)m|=0x02;
  return m;
}
function parseMeta(meta){
  var isDeflateRaw=!!(meta&0x80);
  var comp=isDeflateRaw?'deflate-raw':COMP_REV[(meta>>3)&3];
  return {
    /* ★ 关键修复：右移 5 后只保留 bit 1-0（原 bit 6-5），因为 bit 7 已被占用做 deflate-raw 标志 */
    method:METHOD_REV[(meta>>5)&3],
    compression:comp,
    gbk:!!(meta&0x04),
    encrypted:!!(meta&0x02)
  };
}

/* ══════════ 编码流程 ══════════ */
var lastEncStats={ visibleCount:0 };

/* ══════════ 自动档：实测竞选 ══════════
   本地算法（deflate-raw / gzip / 原生 zstd）零下载成本，全部无条件参选；
   Brotli / ZSTD 外部库在「载荷 ≥ AUTO_EXTERNAL_MIN_BYTES」或「开启强制压缩」
   或「本会话已加载过」时参选，避免为几十字节的收益先下载约 900KB wasm。
   所有候选并行压缩，输出最小者胜出；无一小于原图（且未开强制）则不压缩。 */
function doCompressAuto(bytes, force){
  var algos=[];
  if(nativeSupport.deflateRaw)algos.push('deflate-raw');
  if(nativeSupport.gzip)algos.push('gzip');
  if(nativeSupport.zstd)algos.push('zstd');
  if(force || bytes.length>=AUTO_EXTERNAL_MIN_BYTES){
    if(externalBrotli)algos.push('brotli');
    if(externalZstd && !nativeSupport.zstd)algos.push('zstd');
  }
  if(algos.length===0){
    return Promise.resolve({ bytes:bytes, compressed:false, compressFailed:true });
  }
  var tasks=algos.map(function(a){
    return doCompress(bytes,a).then(function(out){
      return { algo:a, bytes:out };
    }).catch(function(err){
      console.warn('[自动压缩] '+a+' 失败，退出竞选：', err);
      return null;
    });
  });
  return Promise.all(tasks).then(function(results){
    var best=null;
    results.forEach(function(r){
      if(r && (!best || r.bytes.length<best.bytes.length))best=r;
    });
    if(!best)return { bytes:bytes, compressed:false, compressFailed:true };
    if(best.bytes.length<bytes.length || force){
      return { bytes:best.bytes, compressed:true, usedAlgo:best.algo, larger:best.bytes.length>=bytes.length };
    }
    return { bytes:bytes, compressed:false, noGain:true, noGainAlgo:'auto' };
  });
}

function encodePayload(secretText, opts){
  var bytesPromise;
  if(opts.useGBK)bytesPromise=gbkEncode(secretText);
  else bytesPromise=Promise.resolve(new TextEncoder().encode(secretText));

  return bytesPromise.then(function(bytes){
    var originalSize=bytes.length;
    var usedAlgo=null;

    var compressPromise;
    if(opts.algo==='auto'){
      compressPromise=doCompressAuto(bytes, forceCompress).then(function(r){
        if(r.compressFailed)return { bytes:bytes, compressed:false, compressFailed:true, failAlgo:'auto' };
        if(r.compressed){
          usedAlgo=r.usedAlgo;
          return { bytes:r.bytes, compressed:true, larger:r.larger };
        }
        return { bytes:bytes, compressed:false, noGain:r.noGain, noGainAlgo:r.noGainAlgo };
      });
    }else if(opts.algo){
      compressPromise=doCompress(bytes,opts.algo).then(function(cmp){
        if(cmp.length<bytes.length || forceCompress){
          usedAlgo=opts.algo;
          return { bytes:cmp, compressed:true, larger:cmp.length>=bytes.length };
        }
        return { bytes:bytes, compressed:false, noGain:true, noGainAlgo:opts.algo };
      }).catch(function(err){
        console.warn('[压缩] '+opts.algo+' 失败，回退为不压缩：', err);
        return { bytes:bytes, compressed:false, compressFailed:true, failAlgo:opts.algo };
      });
    }else{
      compressPromise=Promise.resolve({ bytes:bytes, compressed:false });
    }

    return compressPromise.then(function(cr){
      var stage2Bytes=cr.bytes;
      var compressed=cr.compressed;
      var larger=cr.larger;
      var compressedSize=cr.bytes.length;

      var encPromise=Promise.resolve({ bytes:stage2Bytes, encrypted:false });
      if(opts.password){
        encPromise=encryptRaw(stage2Bytes, opts.password).then(function(enc){
          return { bytes:enc, encrypted:true };
        });
      }

      return encPromise.then(function(er){
        var finalBytes=er.bytes;
        var encrypted=er.encrypted;

        var meta=buildMeta(opts.method, usedAlgo||'none', opts.useGBK, encrypted);
        var out=new Uint8Array(2+finalBytes.length);
        out[0]=MARK_V2;
        out[1]=meta;
        out.set(finalBytes,2);

        return {
          payload:out,
          meta:meta,
          originalSize:originalSize,
          compressed:compressed,
          compressedSize:compressedSize,
          usedAlgo:usedAlgo,
          encrypted:encrypted,
          larger:larger,
          compressFailed:cr.compressFailed,
          failAlgo:cr.failAlgo,
          noGain:cr.noGain,
          noGainAlgo:cr.noGainAlgo
        };
      });
    });
  });
}

btnEncode.addEventListener('click',function(){
  if(btnEncode.classList.contains('loading'))return;
  var carrier=inCarrier.value, secret=inSecret.value;
  var password=inPasswordHide.value;
  if(!carrier.trim()){ toast('请输入载体文本'); return; }
  if(!secret.trim()){ toast('请输入隐藏内容'); return; }

  var secretLen=countChars(secret);
  if(secretLen>ENCODE_CHAR_LIMIT){ toast('隐藏内容过长（上限 '+formatCount(ENCODE_CHAR_LIMIT)+'）'); return; }
  if(password&&!cryptoAvailable){ toast('当前环境不支持加密'); return; }

  var cleaned=cleanText(carrier);
  var carrierLen=countChars(cleaned);
  if(carrierLen===0){ toast('载体文本为空'); return; }

  var algo=resolveAlgoForEncode();
  var useGBK=(textEncodingPref==='gbk');
  var method=methodPref;

  var bytesPerChar=useGBK?2:3;
  var ratio=estimateCompressRatio(algo);
  var estBytes=secretLen*bytesPerChar*ratio+(password?45:0);
  var bpc=bitsPerChar(method);
  var estChars=Math.ceil(estBytes*8/bpc)+2;
  var perChar=estChars/carrierLen;

  if(perChar>MAX_ZW_PER_CHAR){
    var recommend=Math.ceil(estChars/MAX_ZW_PER_CHAR);
    var confirmMsg='载体太短！\n\n隐藏内容约需 '+formatCount(estChars)+' 个隐藏字符，\n'+
      '当前载体 '+carrierLen+' 字，每个字要挂约 '+Math.round(perChar)+' 个隐藏字符。\n\n'+
      '建议载体至少 '+recommend+' 字。\n\n仍要生成吗？';
    if(!confirm(confirmMsg))return;
  }

  /* 自动档按载荷大小决定是否值得加载外部库；显式选择则无条件加载指定库 */
  var wantExternal=!!forceCompress || (secretLen*bytesPerChar>=AUTO_EXTERNAL_MIN_BYTES);
  var wantBrotli=(algo==='brotli') || (algo==='auto' && wantExternal);
  var wantZstd=(algo==='zstd' && !nativeSupport.zstd) || (algo==='auto' && wantExternal && !nativeSupport.zstd);

  var needLibs=[];
  if(useGBK && !externalIconv)needLibs.push('GBK');
  if(wantBrotli && !externalBrotli)needLibs.push('Brotli');
  if(wantZstd && !externalZstd)needLibs.push('ZSTD');

  btnEncode.classList.add('loading','spin');
  btnEncode.setAttribute('data-loading', needLibs.length?'加载 '+needLibs.join('/')+' 库…':'处理中…');

  setTimeout(function(){
    /* GBK 库加载失败保持快速失败（文本编码是正确性选择）；
       压缩库单个失败不拖累其他库与本地算法，全部不可用时才标记失败并回退 */
    var libLoadFailed=null;
    var otherPreloads=[], compressPreloads=[];
    if(useGBK && !externalIconv)otherPreloads.push(loadExternalIconv());
    if(wantBrotli && !externalBrotli)compressPreloads.push(loadExternalBrotli());
    if(wantZstd && !externalZstd)compressPreloads.push(loadExternalZstd());

    Promise.all(otherPreloads).then(function(){
      return Promise.all(compressPreloads.map(function(p){
        return p.catch(function(err){
          console.warn('[压缩] 外部库加载失败，将跳过该库：', err);
          return null;
        });
      }));
    }).then(function(){
      if(algo==='brotli' && !externalBrotli){
        libLoadFailed=new Error('Brotli 库不可用');
      }else if(algo==='zstd' && !nativeSupport.zstd && !externalZstd){
        libLoadFailed=new Error('ZSTD 库不可用');
      }else if(algo==='auto' && compressPreloads.length>0
               && !externalBrotli && !externalZstd
               && !nativeSupport.deflateRaw && !nativeSupport.gzip && !nativeSupport.zstd){
        libLoadFailed=new Error('所有压缩库均不可用');
      }
      return encodePayload(secret, { algo:libLoadFailed?null:algo, useGBK:useGBK, method:method, password:password||null });
    }).then(function(result){
      if(libLoadFailed && algo){
        result.compressFailed=true;
        result.failAlgo=algo;
      }
      var payload=result.payload;
      var scheme=SCHEMES[hideSchemeIdx];
      var zwSeq=bytesToHiddenChars(payload, method, scheme);

      var chars=Array.from(cleaned);
      var finalResult='';
      if(chars.length>0){
        /* 必须按码点（而非 UTF-16 码元）切分隐藏串：极高压缩比使用的 U+E0100~U+E01EF
           是星条平面字符、由代理对构成。按码元切片会把代理对拆成两半，而两半之间还会被
           插入载体字符，导致该字符永久损坏、提取时静默丢失（曾造成 8-bit 方法必然失败）。 */
        var hiddenCps=Array.from(zwSeq);
        var chunk=Math.ceil(hiddenCps.length/chars.length);
        var segs=new Array(chars.length);
        for(var i=0;i<chars.length;i++){
          var s=i*chunk, e=Math.min(s+chunk,hiddenCps.length);
          segs[i]=(s<hiddenCps.length)?(chars[i]+hiddenCps.slice(s,e).join('')):chars[i];
        }
        finalResult=segs.join('');
      }else{ finalResult=zwSeq; }
      outEncoded.textContent=finalResult;

      var visibleCount=chars.length;
      var hiddenCount=countChars(zwSeq);
      var totalChars=visibleCount+hiddenCount;
      lastEncStats={ visibleCount:visibleCount };

      var parts=[];
      parts.push('<span class="stat-pill hl">可见 '+formatCount(visibleCount)+'</span>');
      parts.push('<span class="stat-pill '+(hiddenCount>500000?'warn':'')+'">隐藏 '+formatCount(hiddenCount)+'</span>');
      if(useGBK)parts.push('<span class="stat-pill">GBK</span>');
      if(method==='base64')parts.push('<span class="stat-pill hl">Base64 · 6-bit</span>');
      else if(method==='highdensity')parts.push('<span class="stat-pill purple">4-bit</span>');
      else if(method==='extreme')parts.push('<span class="stat-pill gold">8-bit</span>');
      if(result.compressed){
        var algoName=(compressPref==='auto'?'自动选出 ':'')+algoDisplayName(result.usedAlgo);
        var libTag=(result.usedAlgo==='brotli'||result.usedAlgo==='zstd')?'（外部库）':'';
        var saved=1-result.compressedSize/result.originalSize;
        var pct=Math.round(saved*100);
        var pctTxt=(saved>=0)?('省 '+pct+'%'):('增 '+Math.abs(pct)+'%');
        var cls=(saved>=0)?'hl':'warn';
        parts.push('<span class="stat-pill '+cls+'">'+algoName+libTag+' · '+pctTxt+' · '+formatBytes(result.originalSize)+' → '+formatBytes(result.compressedSize)+'</span>');
      }else if(result.noGain){
        parts.push('<span class="stat-pill warn">'+algoDisplayName(result.noGainAlgo)+' 压缩后未变小，已用原文</span>');
      }else if(compressPref==='none'){
        parts.push('<span class="stat-pill gray">未压缩</span>');
      }
      if(result.encrypted)parts.push('<span class="stat-pill hl">AES-GCM 已加密</span>');
      if(result.compressFailed){
        parts.push('<span class="stat-pill warn">'+algoDisplayName(result.failAlgo)+' 压缩失败 · 已按原文嵌入</span>');
      }
      statsEnc.innerHTML=parts.join('');

      if(result.compressFailed){
        toast(algoDisplayName(result.failAlgo)+' 压缩失败（外部库加载或调用异常），已回退为不压缩');
      }

      if(totalChars>DOWNLOAD_THRESHOLD){
        statsEnc.innerHTML+='<span class="stat-pill warn">文本较长，建议点击「下载」保存 .txt 分享</span>';
      }

      btnEncode.classList.remove('loading','spin');
      updateCompressHint();
      expandAndScroll(resEncode);
    }).catch(function(err){
      btnEncode.classList.remove('loading','spin');
      updateCompressHint();
      toast('处理失败：'+(err.message||'未知错误'));
    });
  }, 20);
});
