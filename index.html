<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>文字隐写术</title>
<style>
    :root{
        --bg:#F5F5F7;
        --card:#FFFFFF;
        --card-2:#FAFAFC;
        --fg:#1D1D1F;
        --fg-2:#424245;
        --muted:#86868B;
        --placeholder:rgba(60,60,67,.32);
        --sep:rgba(60,60,67,.10);
        --sep-2:rgba(60,60,67,.055);
        --accent:#0071E3;
        --accent-2:#0A84FF;
        --accent-press:#0062CC;
        --accent-soft:rgba(0,113,227,.10);
        --ok:#34C759;
        --ok-text:#248A3D;
        --warn:#FF9500;
        --warn-text:#C86A00;
        --danger:#FF3B30;
        --danger-text:#D70015;
        --seg-bg:rgba(120,120,128,.10);
        --seg-slider:#FFFFFF;
        --chev:#C7C7CC;
        --toast-bg:rgba(28,28,30,.92);
        --ring:0 0 0 3.5px var(--accent-soft);
        --radius:14px;
        --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
        --spring:cubic-bezier(.32,1.35,.45,1);
        --ios:cubic-bezier(.32,.72,0,1);
    }
    @media(prefers-color-scheme:dark){
        :root{
            --bg:#000000;
            --card:#1C1C1E;
            --card-2:#242426;
            --fg:#F5F5F7;
            --fg-2:#D1D1D6;
            --muted:#98989D;
            --placeholder:rgba(235,235,245,.32);
            --sep:rgba(84,84,88,.55);
            --sep-2:rgba(84,84,88,.28);
            --accent:#0A84FF;
            --accent-2:#3C9CFF;
            --accent-press:#409CFF;
            --accent-soft:rgba(10,132,255,.16);
            --ok:#30D158;
            --ok-text:#30D158;
            --warn:#FF9F0A;
            --warn-text:#FFB340;
            --danger:#FF453A;
            --danger-text:#FF453A;
            --seg-bg:rgba(118,118,128,.24);
            --seg-slider:#48484A;
            --chev:#5A5A5E;
            --toast-bg:rgba(58,58,60,.94);
        }
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{
        -webkit-text-size-adjust:100%;
        background:var(--bg);
    }
    body{
        font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
        background:var(--bg);
        color:var(--fg);
        font-size:15px;line-height:1.5;
        min-height:100vh;
        -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
        -webkit-tap-highlight-color:transparent;
        overflow-x:hidden;
    }
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-thumb{background:rgba(120,120,128,.28);border-radius:3px}
    ::-webkit-scrollbar-track{background:transparent}

    .app{
        max-width:520px;margin:0 auto;
        padding:0 16px 24px;
        min-height:100vh;
        background:var(--bg);
    }

    .header{
        padding:calc(30px + env(safe-area-inset-top)) 4px 18px;
        animation:fadeUp .55s .02s both;
        display:flex;align-items:center;gap:14px;
    }
    .brand-icon{
        width:46px;height:46px;flex-shrink:0;
        border-radius:13px;
        background:linear-gradient(135deg, var(--accent-2), var(--accent));
        display:flex;align-items:center;justify-content:center;
        color:#FFF;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
    }
    .brand-icon svg{width:24px;height:24px}
    .brand-text{min-width:0;flex:1}
    .brand-text h1{
        font-size:25px;font-weight:800;letter-spacing:-.9px;line-height:1.15;
        background:linear-gradient(180deg, var(--fg) 20%, var(--fg-2));
        -webkit-background-clip:text;background-clip:text;
        -webkit-text-fill-color:transparent;
        display:inline-block;
    }
    .brand-text p{font-size:12.5px;color:var(--muted);margin-top:2px;letter-spacing:-.1px}
    @supports not (-webkit-background-clip:text){
        .brand-text h1{background:none;-webkit-text-fill-color:var(--fg);color:var(--fg)}
    }

    .seg{
        position:relative;display:flex;
        background:var(--seg-bg);border-radius:12px;padding:2px;
        margin:0 0 20px;
        box-shadow:inset 0 0 0 .5px var(--sep-2);
        -webkit-backdrop-filter:blur(24px) saturate(180%);
        backdrop-filter:blur(24px) saturate(180%);
        animation:fadeUp .55s .08s both;
    }
    .seg-btn{
        flex:1;position:relative;z-index:1;padding:8px 0;
        font-size:14px;font-weight:600;color:var(--muted);
        background:none;border:none;font-family:inherit;cursor:pointer;
        -webkit-tap-highlight-color:transparent;
        letter-spacing:-.1px;
        transition:color .28s,transform .18s var(--spring);
    }
    .seg-btn:active{transform:scale(.94)}
    .seg-btn.active{color:var(--fg);font-weight:700}
    .seg-slider{
        position:absolute;top:2px;left:2px;
        width:calc((100% - 4px)/3);height:calc(100% - 4px);
        background:var(--seg-slider);border-radius:10px;
        box-shadow:
            0 1px 2px rgba(0,0,0,.10),
            0 0 0 .5px rgba(0,0,0,.04),
            0 4px 10px -3px rgba(0,0,0,.10);
        transition:transform .44s var(--spring);
        will-change:transform;
    }

    .panel{display:none}
    .panel.active{display:block;animation:panelIn .34s cubic-bezier(.22,1,.36,1)}
    @keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .panel.active>.group{animation:fadeUp .5s .05s cubic-bezier(.22,1,.36,1) both}
    .panel.active>.btn-primary{animation:fadeUp .5s .13s cubic-bezier(.22,1,.36,1) both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

    .group{
        background:var(--card);border-radius:var(--radius);
        box-shadow:0 0 0 .5px var(--sep-2);
        margin-bottom:16px;overflow:hidden;
        transition:box-shadow .3s;position:relative;
    }
    .group:focus-within{box-shadow:var(--ring)}
    .group>*{position:relative}
    .group>*+*::before{
        content:'';position:absolute;top:0;left:16px;right:16px;
        height:1px;background:var(--sep);
    }

    .field{padding:13px 16px 15px}
    .field-label{
        font-size:12.5px;font-weight:600;display:block;
        margin-bottom:8px;color:var(--fg-2);letter-spacing:-.05px;
        display:flex;align-items:center;justify-content:space-between;gap:8px;
    }
    .field-hint{font-weight:400;color:var(--muted);margin-left:5px;font-size:12px}
    .field-label-text{display:flex;align-items:baseline;min-width:0;flex-wrap:wrap}
    .label-actions{display:flex;gap:6px;flex-shrink:0}
    textarea{
        width:100%;border:none;background:transparent;
        padding:0;font-size:16px;font-family:inherit;color:var(--fg);
        resize:none;outline:none;line-height:1.55;
        -webkit-appearance:none;min-height:66px;
        transition:height .18s ease;
        caret-color:var(--accent);letter-spacing:-.1px;
    }
    textarea::placeholder{color:var(--placeholder);font-weight:400}

    .btn-paste{
        display:inline-flex;align-items:center;gap:4px;
        padding:4px 10px;background:var(--accent-soft);
        border:none;border-radius:7px;
        color:var(--accent);
        font-size:11.5px;font-weight:600;font-family:inherit;
        cursor:pointer;-webkit-tap-highlight-color:transparent;
        transition:transform .15s var(--spring),background .2s,opacity .2s;
        letter-spacing:-.05px;flex-shrink:0;
    }
    .btn-paste:active{transform:scale(.92)}
    .btn-paste:disabled{opacity:.5}
    .btn-paste svg{width:11px;height:11px;flex-shrink:0}

    .file-progress{
        display:none;align-items:center;gap:8px;
        margin-top:8px;padding:8px 10px;
        background:var(--accent-soft);border-radius:8px;
        color:var(--accent);font-size:12px;font-weight:500;
        letter-spacing:-.05px;
    }
    .file-progress.show{display:flex}
    .file-progress .spinner{
        width:14px;height:14px;flex-shrink:0;
        border:2px solid rgba(0,113,227,.25);
        border-top-color:var(--accent);
        border-radius:50%;
        animation:spin .7s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ★ 新增：压缩能力提示行 */
    .compress-hint{
        display:flex;align-items:flex-start;gap:8px;
        margin:-8px 0 16px;padding:10px 12px;
        background:rgba(120,120,128,.08);
        border-radius:10px;
        font-size:12px;line-height:1.5;
        color:var(--muted);
        letter-spacing:-.05px;
        animation:fadeUp .5s .16s both;
    }
    .compress-hint svg{
        width:14px;height:14px;flex-shrink:0;margin-top:2px;
        color:var(--muted);
    }
    .compress-hint strong{color:var(--fg-2);font-weight:600}
    .compress-hint.ok{background:rgba(52,199,89,.08);color:var(--ok-text)}
    .compress-hint.ok svg{color:var(--ok-text)}
    .compress-hint.ok strong{color:var(--ok-text)}
    @media(prefers-color-scheme:dark){
        .compress-hint{background:rgba(120,120,128,.16)}
        .compress-hint.ok{background:rgba(48,209,88,.14)}
    }

    .paste-hint{
        display:flex;align-items:flex-start;gap:8px;
        margin-top:0;padding:0 12px;
        background:rgba(255,149,0,.10);
        border-radius:9px;
        color:var(--warn-text);font-size:12px;line-height:1.5;
        opacity:0;max-height:0;overflow:hidden;
        transition:opacity .3s,max-height .35s,margin-top .3s,padding .3s;
        letter-spacing:-.05px;
    }
    .paste-hint.show{
        opacity:1;max-height:120px;
        margin-top:10px;padding:10px 12px;
    }
    .paste-hint svg{
        width:14px;height:14px;flex-shrink:0;margin-top:2px;
    }
    .paste-hint strong{font-weight:700}
    @media(prefers-color-scheme:dark){
        .paste-hint{
            background:rgba(255,159,10,.14);
        }
    }

    .field-footer{
        display:flex;justify-content:space-between;align-items:center;
        margin-top:10px;padding-top:8px;
        border-top:1px solid var(--sep-2);
        gap:8px;min-height:24px;
    }
    .field-count{
        font-size:11.5px;color:var(--muted);
        font-variant-numeric:tabular-nums;letter-spacing:-.05px;
        display:flex;align-items:center;gap:8px;
        min-width:0;flex-wrap:wrap;
    }
    .field-count .count-num{white-space:nowrap}
    .field-count .capacity-hint{
        font-size:11px;padding:1px 6px;border-radius:5px;
        background:rgba(120,120,128,.10);color:var(--muted);
        letter-spacing:-.05px;white-space:nowrap;
    }
    .field-count .capacity-hint.warn{
        background:rgba(255,149,0,.14);color:var(--warn-text);
    }
    .field-count .capacity-hint.danger{
        background:rgba(215,0,21,.10);color:var(--danger-text);
    }
    .field-count.warn{color:var(--warn-text);font-weight:600}
    .field-count.danger{color:var(--danger-text);font-weight:600}
    .btn-clear{
        display:inline-flex;align-items:center;gap:3px;
        padding:3px 8px;background:none;border:none;
        color:var(--muted);font-size:11.5px;font-family:inherit;font-weight:500;
        cursor:pointer;border-radius:6px;
        transition:background .15s,color .15s,opacity .2s;
        -webkit-tap-highlight-color:transparent;letter-spacing:-.05px;
        flex-shrink:0;
    }
    .btn-clear:active:not(:disabled){background:rgba(120,120,128,.12);color:var(--fg-2)}
    .btn-clear:disabled{opacity:0;pointer-events:none}

    .password-wrap{display:flex;align-items:center;gap:6px}
    .password-wrap input{
        flex:1;min-width:0;border:none;background:transparent;
        padding:0;font-size:16px;font-family:inherit;color:var(--fg);
        outline:none;-webkit-appearance:none;
        letter-spacing:.5px;font-variant-numeric:tabular-nums;
        caret-color:var(--accent);
    }
    .password-wrap input::placeholder{color:var(--placeholder);font-weight:400;letter-spacing:-.1px}
    .btn-toggle-pw{
        display:flex;align-items:center;justify-content:center;
        background:none;border:none;padding:4px;margin-right:-4px;
        cursor:pointer;color:var(--muted);border-radius:6px;
        flex-shrink:0;transition:color .15s,background .15s;
        -webkit-tap-highlight-color:transparent;
    }
    .btn-toggle-pw:active{background:rgba(120,120,128,.12);color:var(--fg-2)}
    .btn-toggle-pw svg{width:18px;height:18px;display:block}
    .btn-toggle-pw .icon-eye-off{display:none}
    .btn-toggle-pw.revealed .icon-eye{display:none}
    .btn-toggle-pw.revealed .icon-eye-off{display:block}

    .pw-strength{
        display:flex;align-items:center;gap:8px;
        margin-top:10px;padding-top:8px;
        border-top:1px solid var(--sep-2);
        opacity:0;max-height:0;overflow:hidden;
        transition:opacity .25s,max-height .3s,margin-top .25s,padding-top .25s;
    }
    .pw-strength.show{
        opacity:1;max-height:30px;
        margin-top:10px;padding-top:8px;
    }
    .pw-bars{display:flex;gap:3px;flex:1}
    .pw-bar{
        flex:1;height:4px;border-radius:2px;
        background:rgba(120,120,128,.18);
        transition:background .25s;
    }
    .pw-bar.active-weak{background:var(--danger)}
    .pw-bar.active-fair{background:var(--warn)}
    .pw-bar.active-good{background:#5AC8FA}
    .pw-bar.active-strong{background:var(--ok)}
    .pw-strength-label{
        font-size:11px;font-weight:600;
        min-width:44px;text-align:right;
        letter-spacing:-.05px;
        color:var(--muted);
    }
    .pw-strength-label.tone-weak{color:var(--danger-text)}
    .pw-strength-label.tone-fair{color:var(--warn-text)}
    .pw-strength-label.tone-good{color:#1B87C9}
    .pw-strength-label.tone-strong{color:var(--ok-text)}

    .row{
        display:flex;align-items:center;gap:8px;
        width:100%;padding:14px 16px;
        background:none;border:none;cursor:pointer;
        font-family:inherit;font-size:15px;color:var(--fg);text-align:left;
        -webkit-tap-highlight-color:transparent;transition:background .15s;
    }
    .row:active{background:rgba(120,120,128,.08)}
    .row-label{font-size:15px;flex-shrink:0;font-weight:500;letter-spacing:-.1px}
    .row-value{
        margin-left:auto;font-size:13.5px;color:var(--muted);
        max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
        font-weight:500;
    }
    .chev{width:13px;height:13px;color:var(--chev);flex-shrink:0}

    .btn-primary{
        width:100%;padding:16px;
        background:linear-gradient(180deg, var(--accent-2), var(--accent));
        color:#FFF;border:none;border-radius:var(--radius);
        font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;
        letter-spacing:-.2px;position:relative;
        -webkit-tap-highlight-color:transparent;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
        transition:transform .15s var(--spring), filter .2s;
    }
    .btn-primary:active:not(:disabled){
        transform:scale(.975);
        filter:brightness(.94);
    }
    .btn-primary:disabled{opacity:.65;cursor:not-allowed;pointer-events:none}
    .btn-primary.loading{color:transparent;pointer-events:none}
    .btn-primary.loading::before{
        content:'处理中…';
        position:absolute;top:50%;left:50%;
        transform:translate(-50%,-50%);
        color:#FFF;font-size:15px;font-weight:600;
        letter-spacing:-.1px;
    }
    .btn-primary.loading.show-spinner::before{content:''}
    .btn-primary.loading::after{
        content:'';position:absolute;top:50%;left:50%;
        width:18px;height:18px;margin:-9px 0 0 -9px;
        border:2px solid rgba(255,255,255,.35);
        border-top-color:transparent;border-radius:50%;
        animation:spin .7s linear infinite;
        opacity:0;
    }
    .btn-primary.loading.show-spinner::after{opacity:1}

    .result-block{
        max-height:0;opacity:0;overflow:hidden;
        margin-top:0;margin-bottom:0;
        transition:max-height .5s var(--ios),opacity .32s .05s,margin-top .32s,margin-bottom .32s;
    }
    .result-block.show{opacity:1;margin-top:20px;margin-bottom:16px}
    .result-head{
        display:flex;justify-content:space-between;align-items:center;
        gap:10px;padding:15px 16px 8px;
    }
    .result-title{
        font-size:13.5px;font-weight:700;flex-shrink:0;
        color:var(--fg-2);letter-spacing:-.1px;
        display:flex;align-items:center;gap:7px;
    }
    .result-title::before{
        content:'';width:6px;height:6px;border-radius:50%;
        background:linear-gradient(180deg, var(--accent-2), var(--accent));
        flex-shrink:0;
    }
    .result-actions{display:flex;align-items:center;gap:8px;min-width:0}
    .result-meta{
        font-size:12px;color:var(--muted);
        font-variant-numeric:tabular-nums;white-space:nowrap;
        letter-spacing:-.1px;
    }
    .result-body{
        margin:6px 16px 10px;padding:13px 15px;
        background:var(--card-2);border-radius:11px;
        box-shadow:inset 0 0 0 .5px var(--sep-2);
        font-size:15px;line-height:1.6;word-break:break-all;user-select:all;
        min-height:46px;max-height:240px;overflow-y:auto;
        -webkit-overflow-scrolling:touch;
    }
    .result-stats{
        display:flex;gap:14px;flex-wrap:wrap;
        margin:0 16px 16px;
        font-size:11.5px;color:var(--muted);
        letter-spacing:-.05px;line-height:1.5;
    }
    .result-stats span{
        display:inline-flex;align-items:center;gap:4px;
    }
    .result-stats span::before{
        content:'';width:5px;height:5px;border-radius:50%;
        background:var(--muted);opacity:.5;
    }
    .result-stats span.hl{color:var(--accent);font-weight:600}
    .result-stats span.hl::before{background:var(--accent);opacity:1}
    .result-stats span.warn{color:var(--warn-text);font-weight:600}
    .result-stats span.warn::before{background:var(--warn);opacity:1}

    .btn-copy{
        display:inline-flex;align-items:center;gap:5px;
        padding:6px 13px;border:none;border-radius:999px;
        background:var(--accent-soft);color:var(--accent);
        font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;
        -webkit-tap-highlight-color:transparent;flex-shrink:0;
        box-shadow:inset 0 0 0 .5px rgba(0,113,227,.12);
        transition:transform .15s var(--spring),background .25s,color .25s;
    }
    .btn-copy:active{transform:scale(.93)}
    .btn-copy.done{
        background:rgba(52,199,89,.14);color:var(--ok-text);
        box-shadow:inset 0 0 0 .5px rgba(52,199,89,.18);
    }
    .btn-copy svg{flex-shrink:0}

    .extracted{
        margin:14px 16px 10px;padding:14px 16px;
        background:linear-gradient(180deg, var(--accent-soft), rgba(0,113,227,.06));
        border-radius:12px;
        box-shadow:inset 0 0 0 .5px rgba(0,113,227,.14);
        font-size:16px;line-height:1.55;word-break:break-all;user-select:all;
        animation:rise .45s var(--spring) both;
    }
    @keyframes rise{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

    .status-card{
        display:flex;align-items:flex-start;gap:11px;
        margin:14px 16px 16px;padding:12px 14px;
        border-radius:12px;font-size:13.5px;line-height:1.5;
        animation:rise .4s var(--spring) both;
    }
    .status-card.tone-error{
        background:rgba(215,0,21,.08);
        box-shadow:inset 0 0 0 .5px rgba(215,0,21,.16);
        color:var(--danger-text);
    }
    .status-card.tone-warn{
        background:rgba(255,149,0,.10);
        box-shadow:inset 0 0 0 .5px rgba(255,149,0,.20);
        color:var(--warn-text);
    }
    .status-card.tone-ok{
        background:rgba(52,199,89,.10);
        box-shadow:inset 0 0 0 .5px rgba(52,199,89,.18);
        color:var(--ok-text);
    }
    @media(prefers-color-scheme:dark){
        .status-card.tone-error{
            background:rgba(255,69,58,.14);
            box-shadow:inset 0 0 0 .5px rgba(255,69,58,.22);
        }
        .status-card.tone-warn{
            background:rgba(255,159,10,.14);
            box-shadow:inset 0 0 0 .5px rgba(255,159,10,.22);
        }
        .status-card.tone-ok{
            background:rgba(48,209,88,.14);
            box-shadow:inset 0 0 0 .5px rgba(48,209,88,.22);
        }
    }
    .status-icon{
        width:20px;height:20px;flex-shrink:0;
        display:flex;align-items:center;justify-content:center;
        border-radius:50%;font-size:13px;font-weight:800;font-style:italic;
        color:#FFF;margin-top:1px;
    }
    .status-card.tone-error .status-icon{background:var(--danger-text)}
    .status-card.tone-warn .status-icon{background:var(--warn)}
    .status-card.tone-ok .status-icon{background:var(--ok-text)}
    .status-text{flex:1;min-width:0;font-weight:500}
    .status-text strong{font-weight:700}
    .scheme-found{
        margin:0 16px 16px;font-size:12.5px;color:var(--muted);
        letter-spacing:-.05px;
    }
    .scheme-found strong{color:var(--accent);font-weight:600}

    .stats{display:flex;gap:10px;margin-bottom:14px}
    .stat{
        flex:1;background:var(--card);border-radius:var(--radius);
        padding:16px 6px 14px;text-align:center;
        box-shadow:0 0 0 .5px var(--sep-2);
        position:relative;overflow:hidden;
        animation:pop .42s var(--spring) both;
    }
    .stat::before{
        content:'';position:absolute;inset:0;
        background:linear-gradient(180deg, transparent 40%, rgba(120,120,128,.035));
        pointer-events:none;
    }
    .stat:nth-child(2){animation-delay:.06s}
    .stat:nth-child(3){animation-delay:.12s}
    @keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
    .stat-num{
        font-size:27px;font-weight:800;letter-spacing:-1.2px;
        line-height:1;font-variant-numeric:tabular-nums;
        background:linear-gradient(180deg, var(--fg) 20%, var(--fg-2));
        -webkit-background-clip:text;background-clip:text;
        -webkit-text-fill-color:transparent;position:relative;
    }
    .stat-num.hl{
        background:linear-gradient(180deg, var(--accent-2), var(--accent));
        -webkit-background-clip:text;background-clip:text;
        -webkit-text-fill-color:transparent;
    }
    @supports not (-webkit-background-clip:text){
        .stat-num{background:none;-webkit-text-fill-color:var(--fg);color:var(--fg)}
        .stat-num.hl{background:none;-webkit-text-fill-color:var(--accent);color:var(--accent)}
    }
    .stat-label{
        font-size:11.5px;color:var(--muted);margin-top:5px;
        letter-spacing:-.05px;font-weight:500;
    }

    .tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;min-height:30px}
    .tag{
        display:inline-flex;align-items:center;gap:6px;
        padding:6px 11px;background:var(--card);border-radius:10px;font-size:12px;
        box-shadow:0 0 0 .5px var(--sep-2);
        animation:pop .34s var(--spring) both;letter-spacing:-.05px;
    }
    .tag-dot{
        width:7px;height:7px;border-radius:50%;flex-shrink:0;
    }
    .tag-name{font-weight:600;color:var(--fg-2)}
    .tag-code{color:var(--muted);font-family:var(--mono);font-size:10.5px}
    .tag-count{font-weight:700;margin-left:1px;font-variant-numeric:tabular-nums}
    .tags-empty{
        display:inline-flex;align-items:center;gap:8px;
        font-size:13px;color:var(--muted);line-height:30px;
    }
    .tags-empty::before{
        content:'';width:6px;height:6px;border-radius:50%;
        background:var(--muted);opacity:.4;
    }

    .viz-title{
        display:flex;justify-content:space-between;align-items:center;
        font-size:13.5px;font-weight:700;padding:15px 16px 8px;
        color:var(--fg-2);letter-spacing:-.1px;gap:8px;
    }
    .viz-title-actions{display:flex;gap:8px}
    .viz{
        margin:6px 16px 16px;padding:13px 15px;
        background:var(--card-2);border-radius:11px;
        box-shadow:inset 0 0 0 .5px var(--sep-2);
        font-size:15px;line-height:2.3;word-break:break-all;
        max-height:264px;overflow-y:auto;
        -webkit-overflow-scrolling:touch;
    }
    .zw{
        display:inline-block;padding:1px 5px;border-radius:5px;
        font-size:9.5px;font-weight:700;font-family:var(--mono);
        vertical-align:middle;margin:0 1px;line-height:1.75;
        position:relative;top:-.5px;white-space:nowrap;
        box-shadow:inset 0 0 0 .5px currentColor;
        animation:pop .3s var(--spring) both;
    }
    .viz-empty{
        display:inline-flex;align-items:center;gap:8px;
        color:var(--muted);font-size:13.5px;
    }
    .viz-empty::before{
        content:'';width:6px;height:6px;border-radius:50%;
        background:var(--muted);opacity:.4;
    }
    .viz-more{display:block;font-size:11.5px;color:var(--muted);margin-top:8px}
    @media(prefers-color-scheme:dark){
        .zw{filter:brightness(1.75) saturate(1.15)}
    }

    .sheet-overlay{
        position:fixed;inset:0;z-index:100;
        background:rgba(0,0,0,.42);
        -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
        opacity:0;visibility:hidden;transition:opacity .34s,visibility .34s;
    }
    .sheet-overlay.open{opacity:1;visibility:visible}
    .sheet{
        position:fixed;left:50%;bottom:0;z-index:101;
        width:min(100%,520px);
        background:var(--card);
        border-radius:20px 20px 0 0;
        transform:translateX(-50%) translateY(104%);
        transition:transform .44s var(--ios);
        max-height:78vh;display:flex;flex-direction:column;
        padding-bottom:calc(6px + env(safe-area-inset-bottom));
        box-shadow:0 -1px 0 var(--sep-2), 0 -12px 48px -8px rgba(0,0,0,.18);
    }
    .sheet.open{transform:translateX(-50%) translateY(0)}
    .sheet-handle{
        width:38px;height:5px;border-radius:3px;
        background:rgba(120,120,128,.28);margin:10px auto 4px;flex-shrink:0;
    }
    .sheet-title{
        padding:10px 18px 14px;text-align:center;
        font-size:13px;font-weight:600;color:var(--muted);
        border-bottom:1px solid var(--sep);flex-shrink:0;letter-spacing:-.1px;
    }
    .sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 0 6px}
    .sheet-opt{
        display:flex;align-items:center;gap:12px;
        width:100%;padding:14px 18px;
        background:none;border:none;cursor:pointer;
        font-family:inherit;text-align:left;
        -webkit-tap-highlight-color:transparent;
        position:relative;transition:background .15s;
    }
    .sheet-opt:active{background:rgba(120,120,128,.08)}
    .sheet-opt+.sheet-opt::before{
        content:'';position:absolute;top:0;left:18px;right:18px;
        height:1px;background:var(--sep);
    }
    .opt-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
    .opt-name{font-size:15.5px;font-weight:600;letter-spacing:-.15px}
    .opt-desc{font-size:12px;color:var(--muted);font-family:var(--mono)}
    .opt-note{font-size:12px;color:var(--muted);line-height:1.45;margin-top:1px}
    .opt-check{
        width:22px;height:22px;flex-shrink:0;color:var(--accent);
        opacity:0;transform:scale(.4);
        transition:opacity .2s,transform .3s var(--spring);
    }
    .sheet-opt.selected .opt-check{opacity:1;transform:scale(1)}
    .sheet-opt.selected .opt-name{color:var(--accent)}
    .sheet-cancel{
        width:100%;padding:16px;background:none;border:none;
        border-top:1px solid var(--sep);
        font-size:16px;font-weight:600;color:var(--accent);
        font-family:inherit;cursor:pointer;flex-shrink:0;letter-spacing:-.2px;
        -webkit-tap-highlight-color:transparent;transition:background .15s;
    }
    .sheet-cancel:active{background:rgba(120,120,128,.08)}

    .toast{
        position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;
        transform:translateX(-50%) translateY(-20px) scale(.92);
        background:var(--toast-bg);color:#FFF;
        -webkit-backdrop-filter:blur(20px) saturate(180%);
        backdrop-filter:blur(20px) saturate(180%);
        padding:11px 20px;border-radius:999px;
        font-size:13.5px;font-weight:600;white-space:nowrap;
        letter-spacing:-.1px;
        opacity:0;pointer-events:none;z-index:200;
        box-shadow:0 12px 32px -8px rgba(0,0,0,.28), inset 0 0 0 .5px rgba(255,255,255,.08);
        transition:opacity .32s,transform .38s var(--spring);
        max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;
    }
    .toast.visible{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

    .btn-top{
        position:fixed;
        right:calc(50% - 260px + 16px);
        bottom:calc(20px + env(safe-area-inset-bottom));
        z-index:50;
        width:44px;height:44px;border-radius:50%;
        background:var(--card);
        border:none;cursor:pointer;
        display:flex;align-items:center;justify-content:center;
        color:var(--fg-2);
        box-shadow:0 0 0 .5px var(--sep-2), 0 6px 20px -4px rgba(0,0,0,.15);
        opacity:0;visibility:hidden;transform:scale(.7) translateY(10px);
        transition:opacity .3s,visibility .3s,transform .35s var(--spring);
        -webkit-tap-highlight-color:transparent;
    }
    @media(max-width:552px){
        .btn-top{right:16px}
    }
    .btn-top.visible{opacity:1;visibility:visible;transform:scale(1) translateY(0)}
    .btn-top:active{transform:scale(.9)}
    .btn-top svg{width:18px;height:18px}

    .foot{padding:14px 0 4px;text-align:center}
    .foot span{
        font-size:11.5px;color:var(--muted);line-height:1.85;
        display:block;opacity:.7;letter-spacing:-.05px;
    }

    @media(prefers-reduced-motion:reduce){
        *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
    }
</style>
</head>
<body>
<div class="app">
    <header class="header">
        <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2l2.4 5.5L20 9l-4.5 3.7L17 19l-5-3-5 3 1.5-6.3L4 9l5.6-1.5z"/>
            </svg>
        </div>
        <div class="brand-text">
            <h1>文字隐写术</h1>
            <p>把秘密藏进看似平常的文字里</p>
        </div>
    </header>

    <nav class="seg" role="tablist">
        <div class="seg-slider" id="segSlider"></div>
        <button class="seg-btn active" role="tab" aria-selected="true"  data-tab="hide">隐藏</button>
        <button class="seg-btn" role="tab" aria-selected="false" data-tab="extract">提取</button>
        <button class="seg-btn" role="tab" aria-selected="false" data-tab="detect">检测</button>
    </nav>

    <main>
        <!-- ====== 隐藏 ====== -->
        <section class="panel active" id="pHide" role="tabpanel">
            <div class="group">
                <div class="field">
                    <label class="field-label" for="inCarrier">
                        <span class="field-label-text">载体文本<span class="field-hint">表面上显示的文字</span></span>
                        <button class="btn-paste" type="button" id="btnPasteCarrier">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            粘贴
                        </button>
                    </label>
                    <textarea id="inCarrier" rows="3" placeholder="例如：今天天气真好"></textarea>
                    <div class="field-footer">
                        <span class="field-count" id="count_inCarrier">0 字</span>
                        <button class="btn-clear" type="button" data-clear="inCarrier">清空</button>
                    </div>
                </div>
                <button class="row" id="rowSchemeHide" type="button">
                    <span class="row-label">编码方案</span>
                    <span class="row-value" id="valSchemeHide">变体方案</span>
                    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
                </button>
                <div class="field">
                    <label class="field-label" for="inPasswordHide">
                        <span class="field-label-text">加密密码<span class="field-hint">可选，留空则不加密</span></span>
                    </label>
                    <div class="password-wrap">
                        <input id="inPasswordHide" type="password" placeholder="输入密码以加密隐藏内容" autocomplete="off">
                        <button class="btn-toggle-pw" type="button" data-target="inPasswordHide" aria-label="切换密码可见">
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                    <div class="pw-strength" id="pwStrengthHide">
                        <div class="pw-bars">
                            <div class="pw-bar"></div>
                            <div class="pw-bar"></div>
                            <div class="pw-bar"></div>
                            <div class="pw-bar"></div>
                        </div>
                        <span class="pw-strength-label" id="pwLabelHide"></span>
                    </div>
                </div>
                <div class="field">
                    <label class="field-label" for="inSecret">
                        <span class="field-label-text">隐藏内容<span class="field-hint">要藏进去的信息</span></span>
                        <button class="btn-paste" type="button" id="btnPasteSecret">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            粘贴
                        </button>
                    </label>
                    <textarea id="inSecret" rows="3" placeholder="例如：这是一段秘密"></textarea>
                    <div class="field-footer">
                        <span class="field-count" id="count_inSecret">0 字</span>
                        <button class="btn-clear" type="button" data-clear="inSecret">清空</button>
                    </div>
                </div>
            </div>

            <!-- ★ 压缩能力提示 -->
            <div class="compress-hint" id="compressHint" hidden></div>

            <button class="btn-primary" id="btnEncode" type="button">生成隐写文本</button>

            <div class="result-block" id="resEncode">
                <div class="group">
                    <div class="result-head">
                        <span class="result-title">生成结果</span>
                        <div class="result-actions">
                            <button class="btn-copy" id="btnDownload" type="button">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
                                <span>下载</span>
                            </button>
                            <button class="btn-copy" id="btnCopyEnc" type="button">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                <span id="copyLabel">复制</span>
                            </button>
                        </div>
                    </div>
                    <div class="result-body" id="outEncoded"></div>
                    <div class="result-stats" id="statsEnc"></div>
                </div>
            </div>
        </section>

        <!-- ====== 提取 ====== -->
        <section class="panel" id="pExtract" role="tabpanel">
            <div class="group">
                <div class="field">
                    <label class="field-label" for="inPaste">
                        <span class="field-label-text">粘贴文本<span class="field-hint">可能含有隐藏内容的文本</span></span>
                        <div class="label-actions">
                            <button class="btn-paste" type="button" id="btnImport">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
                                导入
                            </button>
                            <button class="btn-paste" type="button" id="btnPaste">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                粘贴
                            </button>
                        </div>
                    </label>
                    <textarea id="inPaste" rows="4" placeholder="将隐写文本粘贴到这里，或点击「导入」选择 .txt 文件"></textarea>
                    <div class="file-progress" id="fileProgress">
                        <span class="spinner"></span>
                        <span id="fileProgressText">读取文件中…</span>
                    </div>
                    <div class="field-footer">
                        <span class="field-count" id="count_inPaste">0 字</span>
                        <button class="btn-clear" type="button" data-clear="inPaste">清空</button>
                    </div>
                </div>
                <button class="row" id="rowSchemeExtract" type="button">
                    <span class="row-label">提取方案</span>
                    <span class="row-value" id="valSchemeExtract">自动检测</span>
                    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
                </button>
                <div class="field">
                    <label class="field-label" for="inPasswordExtract">
                        <span class="field-label-text">解密密码<span class="field-hint">如果内容已加密</span></span>
                    </label>
                    <div class="password-wrap">
                        <input id="inPasswordExtract" type="password" placeholder="输入密码以解密隐藏内容" autocomplete="off">
                        <button class="btn-toggle-pw" type="button" data-target="inPasswordExtract" aria-label="切换密码可见">
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>
            </div>
            <button class="btn-primary" id="btnDecode" type="button">解析提取</button>

            <div class="result-block" id="resDecode">
                <div class="group">
                    <div class="result-head">
                        <span class="result-title">提取结果</span>
                        <div class="result-actions">
                            <button class="btn-copy" id="btnCopyDec" type="button" style="display:none">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                <span id="copyDecLabel">复制</span>
                            </button>
                        </div>
                    </div>
                    <div id="outDecoded"></div>
                </div>
            </div>
        </section>

        <!-- ====== 检测 ====== -->
        <section class="panel" id="pDetect" role="tabpanel">
            <div class="group">
                <div class="field">
                    <label class="field-label" for="inDetect">
                        <span class="field-label-text">输入文本<span class="field-hint">检测不可见字符与微符号</span></span>
                        <button class="btn-paste" type="button" id="btnPasteDetect">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            粘贴
                        </button>
                    </label>
                    <textarea id="inDetect" rows="4" placeholder="粘贴任意文本，检测其中是否含有隐藏字符"></textarea>
                    <div class="field-footer">
                        <span class="field-count" id="count_inDetect">0 字</span>
                        <button class="btn-clear" type="button" data-clear="inDetect">清空</button>
                    </div>
                </div>
            </div>
            <button class="btn-primary" id="btnDetect" type="button">开始检测</button>

            <div class="result-block" id="resDetect">
                <div class="stats">
                    <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-label">总字符</div></div>
                    <div class="stat"><div class="stat-num" id="statVisible">0</div><div class="stat-label">可见字符</div></div>
                    <div class="stat"><div class="stat-num" id="statHidden">0</div><div class="stat-label">隐藏字符</div></div>
                </div>
                <div class="tags" id="typeList"></div>
                <div class="group">
                    <div class="viz-title">
                        <span>字符可视化</span>
                        <div class="viz-title-actions">
                            <button class="btn-paste" type="button" id="btnCopyReport" style="display:none">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                复制报告
                            </button>
                        </div>
                    </div>
                    <div class="viz" id="vizText"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="foot">

/* ══════════ 通用压缩 / 解压 ══════════ */
function compressBytes(bytes, algo){
    if(!algo)return Promise.reject(new Error('no-compression-support'));
    try{
        var cs=new CompressionStream(algo);
        var writer=cs.writable.getWriter();
        writer.write(bytes);
        writer.close();
        return collectStream(cs.readable);
    }catch(e){ return Promise.reject(e); }
}
function decompressBytes(bytes, algo){
    if(!algo)return Promise.reject(new Error('no-compression-support'));
    try{
        var ds=new DecompressionStream(algo);
        var writer=ds.writable.getWriter();
        writer.write(bytes);
        writer.close();
        return collectStream(ds.readable);
    }catch(e){ return Promise.reject(e); }
}
function collectStream(readable){
    var reader=readable.getReader();
    var chunks=[];
    var total=0;
    function pump(){
        return reader.read().then(function(result){
            if(result.done){
                var out=new Uint8Array(total);
                var offset=0;
                for(var i=0;i<chunks.length;i++){
                    out.set(chunks[i], offset);
                    offset+=chunks[i].length;
                }
                return out;
            }
            chunks.push(result.value);
            total+=result.value.length;
            return pump();
        });
    }
    return pump();
}

/* ══════════ 加密模块 ══════════ */
function deriveKey(password, salt){
    var pwBytes=new TextEncoder().encode(password);
    return crypto.subtle.importKey(
        'raw', pwBytes, { name:'PBKDF2' }, false, ['deriveKey']
    ).then(function(baseKey){
        return crypto.subtle.deriveKey(
            { name:'PBKDF2', salt:salt, iterations:PBKDF2_ITER, hash:'SHA-256' },
            baseKey,
            { name:'AES-GCM', length:256 },
            false,
            ['encrypt','decrypt']
        );
    });
}
function encryptBytes(plainBytes, password, marker){
    if(marker===undefined)marker=MARK_ENC;
    var salt=crypto.getRandomValues(new Uint8Array(SALT_LEN));
    var iv=crypto.getRandomValues(new Uint8Array(IV_LEN));
    return deriveKey(password, salt).then(function(key){
        return crypto.subtle.encrypt({ name:'AES-GCM', iv:iv }, key, plainBytes);
    }).then(function(cipherBuf){
        var cipher=new Uint8Array(cipherBuf);
        var out=new Uint8Array(1+SALT_LEN+IV_LEN+cipher.length);
        out[0]=marker;
        out.set(salt, 1);
        out.set(iv, 1+SALT_LEN);
        out.set(cipher, 1+SALT_LEN+IV_LEN);
        return out;
    });
}
function decryptBytes(data, password){
    if(data.length < SALT_LEN+IV_LEN+TAG_LEN)return Promise.resolve(null);
    var salt=data.slice(0, SALT_LEN);
    var iv=data.slice(SALT_LEN, SALT_LEN+IV_LEN);
    var cipher=data.slice(SALT_LEN+IV_LEN);
    return deriveKey(password, salt).then(function(key){
        return crypto.subtle.decrypt({ name:'AES-GCM', iv:iv }, key, cipher);
    }).then(function(plainBuf){
        return new Uint8Array(plainBuf);
    }).catch(function(){ return null; });
}

/* ══════════ 密码强度 ══════════ */
function evaluatePassword(pw){
    if(!pw)return {score:0, label:''};
    var len=Array.from(pw).length;
    var hasLower=/[a-z]/.test(pw);
    var hasUpper=/[A-Z]/.test(pw);
    var hasDigit=/[0-9]/.test(pw);
    var hasSymbol=/[^A-Za-z0-9]/.test(pw);
    var variety=(hasLower?1:0)+(hasUpper?1:0)+(hasDigit?1:0)+(hasSymbol?1:0);
    var score=0;
    if(len>=4)score=1;
    if(len>=8&&variety>=2)score=2;
    if(len>=10&&variety>=3)score=3;
    if(len>=12&&variety>=4)score=4;
    var labels=['','弱','一般','较好','强'];
    return {score:score, label:labels[score]};
}
function updatePwStrength(pwEl, wrapEl, labelEl){
    var res=evaluatePassword(pwEl.value);
    if(!pwEl.value){
        wrapEl.classList.remove('show');
        labelEl.textContent='';
        labelEl.className='pw-strength-label';
        return;
    }
    wrapEl.classList.add('show');
    var bars=wrapEl.querySelectorAll('.pw-bar');
    var cls='';
    if(res.score===1)cls='active-weak';
    else if(res.score===2)cls='active-fair';
    else if(res.score===3)cls='active-good';
    else if(res.score>=4)cls='active-strong';
    bars.forEach(function(b,i){
        b.className='pw-bar';
        if(i<res.score)b.classList.add(cls);
    });
    labelEl.textContent=res.label;
    labelEl.className='pw-strength-label tone-'+(res.score===1?'weak':res.score===2?'fair':res.score===3?'good':'strong');
}

            }else if(ratio>5){

/* ══════════ 零宽字符编解码 ══════════ */
function bytesToZeroWidth(bytes,zero,one){
    var parts=new Array(bytes.length*8);
    var p=0;
    for(var i=0;i<bytes.length;i++){
        var bin=bytes[i].toString(2);
        while(bin.length<8)bin='0'+bin;
        for(var j=0;j<8;j++){
            parts[p++]=(bin.charCodeAt(j)===48)?zero:one;
        }
    }
    return parts.join('');
}
function zeroWidthToBytes(zw,zero,one){
    var len=zw.length;
    var bits=new Array(len);
    var count=0;
    for(var i=0;i<len;i++){
        var c=zw.charAt(i);
        if(c===zero)bits[count++]='0';
        else if(c===one)bits[count++]='1';
    }
    if(count===0||count%8!==0)return null;
    var bytes=new Uint8Array(count/8);
    for(var k=0;k<bytes.length;k++){
        var base=k*8;
        var b=0;
        for(var m=0;m<8;m++){
            b=(b<<1)|(bits[base+m]==='1'?1:0);
        }
        bytes[k]=b;
    }
    return bytes;
}
function extractZw(text,scheme){
    var zw='', cps=Array.from(text);
    for(var i=0;i<cps.length;i++){
        if(cps[i]===scheme.zero||cps[i]===scheme.one)zw+=cps[i];
    }
    return zw;
}

btnEncode.addEventListener('click',function(){
    if(btnEncode.classList.contains('loading'))return;
    var carrier=inCarrier.value, secret=inSecret.value;
    var password=inPasswordHide.value;
    if(!carrier.trim()){ toast('请输入载体文本'); return; }
    if(!secret.trim()){ toast('请输入隐藏内容'); return; }

    var secretLen=countChars(secret);
    if(secretLen>ENCODE_CHAR_LIMIT){
        toast('隐藏内容过长（上限 '+formatCount(ENCODE_CHAR_LIMIT)+'）');
        return;
    }
    if(password&&!cryptoAvailable){ toast('当前环境不支持加密'); return; }

    var scheme=SCHEMES[hideSchemeIdx];
    var cleaned=cleanText(carrier);
    var carrierLen=countChars(cleaned);
    if(carrierLen===0){ toast('载体文本为空'); return; }

    var rawBytes=new TextEncoder().encode(secret);
    var algo=pickCompressionAlgo();
    var willAttemptCompress=(rawBytes.length>=COMPRESS_TRY_MIN_BYTES && !!algo);

    var estRatio = (algo==='brotli') ? 0.45 : 0.60;
    var estBytes=willAttemptCompress
        ? Math.floor(rawBytes.length*estRatio)+(password?45:0)
        : rawBytes.length+(password?45:0);
    var estZwChars=estBytes*8;
    var perChar=estZwChars/carrierLen;

    if(perChar>MAX_ZW_PER_CHAR){
        var recommend=Math.ceil(estZwChars/MAX_ZW_PER_CHAR);
        var confirmMsg='载体太短！\n\n'+
            '隐藏内容约需 '+formatCount(estZwChars)+' 个零宽字符，\n'+
            '当前载体 '+carrierLen+' 字，每个字要挂约 '+Math.round(perChar)+' 个零宽字符。\n\n'+
            '生成的文本会超过大多数平台的消息限制（微信/短信/Twitter 都发不出去）。\n\n'+
            '建议载体至少 '+recommend+' 字。\n\n'+
            '仍要生成吗？';
        if(!confirm(confirmMsg))return;
    }

    btnEncode.classList.add('loading');
    btnEncode.classList.add('show-spinner');

    setTimeout(function(){
        var stage1;
        if(willAttemptCompress){
            stage1=compressBytes(rawBytes, algo).then(function(cmp){
                if(cmp.length < rawBytes.length){
                    return { bytes: cmp, compressed: true, algo: algo, originalSize: rawBytes.length };
                }
                return { bytes: rawBytes, compressed: false, algo: null, originalSize: rawBytes.length };
            }).catch(function(){
                return { bytes: rawBytes, compressed: false, algo: null, originalSize: rawBytes.length };
            });
        }else{
            stage1=Promise.resolve({ bytes: rawBytes, compressed: false, algo: null, originalSize: rawBytes.length });
        }

        var stage2=stage1.then(function(res){
            if(password){
                var marker;
                if(res.compressed){
                    marker = (res.algo==='brotli') ? MARK_ENC_BR : MARK_ENC_GZ;
                }else{
                    marker = MARK_ENC;
                }
                return encryptBytes(res.bytes, password, marker).then(function(enc){
                    return {
                        bytes: enc,
                        compressed: res.compressed,
                        algo: res.algo,
                        encrypted: true,
                        originalSize: res.originalSize,
                        compressedSize: res.bytes.length
                    };
                });
            }else{
                if(res.compressed){
                    var plainMarker = (res.algo==='brotli') ? MARK_PLAIN_BR : MARK_PLAIN_GZ;
                    var out=new Uint8Array(1+res.bytes.length);
                    out[0]=plainMarker;
                    out.set(res.bytes, 1);
                    return {
                        bytes: out,
                        compressed: true,
                        algo: res.algo,
                        encrypted: false,
                        originalSize: res.originalSize,
                        compressedSize: res.bytes.length
                    };
                }
                return {
                    bytes: res.bytes,
                    compressed: false,
                    algo: null,
                    encrypted: false,
                    originalSize: res.originalSize
                };
            }
        });

        stage2.then(function(result){
            try{
                var zwSeq=bytesToZeroWidth(result.bytes, scheme.zero, scheme.one);
                var chars=Array.from(cleaned);
                var finalResult='';
                if(chars.length>0){
                    var chunk=Math.ceil(zwSeq.length/chars.length);
                    var segs=new Array(chars.length);
                    for(var i=0;i<chars.length;i++){
                        var s=i*chunk, e=Math.min(s+chunk,zwSeq.length);
                        segs[i]=(s<zwSeq.length)?(chars[i]+zwSeq.slice(s,e)):chars[i];
                    }
                    finalResult=segs.join('');
                }else{
                    finalResult=zwSeq;
                }
                outEncoded.textContent=finalResult;

                var visibleCount=chars.length;
                var hiddenCount=zwSeq.length;
                var totalChars=visibleCount+hiddenCount;

                lastEncStats={ visibleCount:visibleCount };

                var parts=[];
                parts.push('<span class="hl">表面可见 '+formatCount(visibleCount)+'</span>');
                parts.push('<span class="'+(hiddenCount>500000?'warn':'')+'">隐藏字符 '+formatCount(hiddenCount)+'</span>');
                if(result.compressed){
                    var saved=1 - result.compressedSize/result.originalSize;
                    var pct=Math.round(saved*100);
                    var algoName=(result.algo==='brotli') ? 'Brotli' : 'gzip';
                    parts.push('<span class="hl">'+algoName+' 压缩 · 省 '+pct+'%（'+formatBytes(result.originalSize)+' → '+formatBytes(result.compressedSize)+'）</span>');
                }else if(algo){
                    parts.push('<span>压缩后未变小，已用原文</span>');
                }
                if(result.encrypted){
                    parts.push('<span class="hl">AES-GCM 已加密</span>');
                }
                statsEnc.innerHTML=parts.join('');

                if(totalChars>DOWNLOAD_THRESHOLD){
                    statsEnc.innerHTML+='<span class="warn">文本较长，建议点击「下载」保存 .txt 分享</span>';
                }

                btnEncode.classList.remove('loading','show-spinner');
                expandAndScroll(resEncode);
            }catch(err){
                btnEncode.classList.remove('loading','show-spinner');
                toast('处理失败：'+(err.message||'内存不足'));
            }
        }).catch(function(err){
            btnEncode.classList.remove('loading','show-spinner');
            toast('处理失败：'+(err.message||'未知错误'));
        });
    }, 20);
});

function tryDecodeBytes(bytes,password){
    if(!bytes||bytes.length===0)return Promise.resolve(null);
    var first=bytes[0];

    if(first===MARK_ENC_BR){
        if(!password)return Promise.resolve({type:'encrypted'});
        return decryptBytes(bytes.slice(1), password).then(function(plainBytes){
            if(!plainBytes)return {type:'wrong-password'};
            return decompressBytes(plainBytes, 'brotli').then(function(rawBytes){
                var text=tryDecodeUtf8(rawBytes);
                if(text&&looksLikeText(text)){
                    return {type:'plain', text:text, encrypted:true, compressed:true, algoName:'Brotli'};
                }
                return {type:'wrong-password'};
            }).catch(function(){
                return {type:'wrong-password'};
            });
        });
    }

    if(first===MARK_ENC_GZ){
        if(!password)return Promise.resolve({type:'encrypted'});
        return decryptBytes(bytes.slice(1), password).then(function(plainBytes){
            if(!plainBytes)return {type:'wrong-password'};
            return decompressBytes(plainBytes, 'gzip').then(function(rawBytes){
                var text=tryDecodeUtf8(rawBytes);
                if(text&&looksLikeText(text)){
                    return {type:'plain', text:text, encrypted:true, compressed:true, algoName:'gzip'};
                }
                return {type:'wrong-password'};
            }).catch(function(){
                return {type:'wrong-password'};
            });
        });
    }

    if(first===MARK_ENC){
        if(!password)return Promise.resolve({type:'encrypted'});
        return decryptBytes(bytes.slice(1), password).then(function(plainBytes){
            if(!plainBytes)return {type:'wrong-password'};
            var text=tryDecodeUtf8(plainBytes);
            if(text&&looksLikeText(text)){
                return {type:'plain', text:text, encrypted:true, compressed:false};
            }
            return {type:'wrong-password'};
        });
    }

    if(first===MARK_PLAIN_BR){
        if(!compressionSupport.brotli)return Promise.resolve(null);
        return decompressBytes(bytes.slice(1), 'brotli').then(function(rawBytes){
            var text=tryDecodeUtf8(rawBytes);
            if(text&&looksLikeText(text)){
                return {type:'plain', text:text, encrypted:false, compressed:true, algoName:'Brotli'};
            }
            return null;
        }).catch(function(){ return null; });
    }

    if(first===MARK_PLAIN_GZ){
        if(!compressionSupport.gzip)return Promise.resolve(null);
        return decompressBytes(bytes.slice(1), 'gzip').then(function(rawBytes){
            var text=tryDecodeUtf8(rawBytes);
            if(text&&looksLikeText(text)){
                return {type:'plain', text:text, encrypted:false, compressed:true, algoName:'gzip'};
            }
            return null;
        }).catch(function(){ return null; });
    }

    var text=tryDecodeUtf8(bytes);
    if(text&&looksLikeText(text)){
        return Promise.resolve({type:'plain', text:text, encrypted:false, compressed:false});
    }
    return Promise.resolve(null);
}

btnDecode.addEventListener('click',function(){
    if(btnDecode.classList.contains('loading'))return;
    var paste=inPaste.value;
    var password=inPasswordExtract.value;
    if(!paste){ toast('请粘贴文本'); return; }

    var sel=EXTRACT_OPTIONS[extractSchemeIdx];
    var candidates=[];
    if(sel.id==='auto'){
        candidates=SCHEMES.slice().sort(function(a,b){
            return (a.id==='microdot'?1:0)-(b.id==='microdot'?1:0);
        });
    }else{
        candidates=[sel];
    }

    btnDecode.classList.add('loading');
    resetDecodeCopyBtn();

    var idx=0;
    var sawEncrypted=false;
    var sawWrongPassword=false;
    var foundAnyZw=false;
    var done=false;

    function tryNext(){
        if(done)return;
        if(idx>=candidates.length){
            done=true;
            btnDecode.classList.remove('loading');
            if(sawEncrypted){
                renderStatus('warn',
                    '<strong>检测到已加密内容</strong>，请在上方输入密码后重试');
            }else if(sawWrongPassword){
                renderStatus('error',
                    '<strong>密码错误</strong>，无法解密。请检查密码是否正确');
            }else if(foundAnyZw){
                renderStatus('error','发现隐藏字符，但无法解析为有效内容');
            }else{
                renderStatus('error','未发现有效的隐藏内容');
            }
            expandAndScroll(resDecode);
            return;
        }
        var scheme=candidates[idx++];
        var zw=extractZw(paste, scheme);
        if(!zw||zw.length===0||zw.length%8!==0){ tryNext(); return; }
        foundAnyZw=true;
        var bytes=zeroWidthToBytes(zw, scheme.zero, scheme.one);
        if(!bytes){ tryNext(); return; }
        tryDecodeBytes(bytes, password).then(function(res){
            if(done)return;
            if(res&&res.type==='plain'){
                done=true;
                btnDecode.classList.remove('loading');
                renderSuccess(res.text, scheme, res.encrypted, res.compressed, res.algoName);
                expandAndScroll(resDecode);
                return;
            }
            if(res&&res.type==='encrypted')sawEncrypted=true;
            if(res&&res.type==='wrong-password')sawWrongPassword=true;
            tryNext();
        }).catch(function(){ tryNext(); });
    }
    tryNext();
});

var lastDetectReport='';

btnDetect.addEventListener('click',function(){
    var text=inDetect.value;
    if(!text){ toast('请输入文本'); return; }

    var counts={};
    ZW_TYPES.forEach(function(t){ counts[t.code]=0; });

    var total=0, visible=0;
    var vizSegments=[];
    var truncated=false;
    var truncTarget=VIZ_LIMIT;

    for(var ch of text){
        total++;
        if(total<=truncTarget){
            var info=ZW_MAP[ch];
            if(info){
                counts[info.code]++;
                vizSegments.push({type:'zw',info:info});
            }else{
                visible++;
                vizSegments.push({type:'char',value:ch});
            }
        }else{
            if(!truncated)truncated=true;
            var info2=ZW_MAP[ch];
            if(info2)counts[info2.code]++;
            else visible++;
        }
    }
    var hidden=total-visible;

    animateNum(statTotal,total);
    animateNum(statVisible,visible);
    animateNum(statHidden,hidden);
    statHidden.classList.toggle('hl',hidden>0);

    var tlHtml='', hasAny=false, tagIdx=0;
    var reportLines=['文字隐写检测报告','总字符：'+total,'可见字符：'+visible,'隐藏字符：'+hidden,'','隐藏字符明细：'];
    ZW_TYPES.forEach(function(t){
        var c=counts[t.code];
        if(c>0){
            hasAny=true;
            tlHtml+='<div class="tag" style="animation-delay:'+(tagIdx*0.06)+'s">'+
                '<span class="tag-dot" style="background:'+t.color+';color:'+t.color+'"></span>'+
                '<span class="tag-name">'+escapeHtml(t.name)+'</span>'+
                '<span class="tag-code">'+t.code+'</span>'+
                '<span class="tag-count">&times;'+c+'</span></div>';
            reportLines.push('· '+t.name+' ('+t.code+') × '+c);
            tagIdx++;
        }
    });
    typeList.innerHTML=hasAny?tlHtml:'<span class="tags-empty">未检测到隐藏字符</span>';

    if(!hasAny){
        vizText.innerHTML='<span class="viz-empty">文本中不包含隐藏字符</span>';
    }else{
        var vHtml='', zwIdx=0;
        for(var j=0;j<vizSegments.length;j++){
            var seg=vizSegments[j];
            if(seg.type==='char'){
                vHtml+=escapeHtml(seg.value);
            }else{
                var ti=seg.info;
                vHtml+='<span class="zw" style="background:'+ti.color+'24;color:'+ti.color+
                    ';animation-delay:'+Math.min(zwIdx*0.02,0.8)+'s">'+ti.code+'</span>';
                zwIdx++;
            }
        }
        if(truncated){
            vHtml+='<span class="viz-more">… 内容过长，仅显示前 '+VIZ_LIMIT+' 个字符</span>';
        }
        vizText.innerHTML=vHtml;
    }

    lastDetectReport=reportLines.join('\n');
    btnCopyReport.style.display=hasAny?'inline-flex':'none';

    expandAndScroll(resDetect);
});

btnCopyReport.addEventListener('click',function(){
    if(!lastDetectReport)return;
    copyText(lastDetectReport).then(function(ok){
        if(ok)toast('检测报告已复制');
        else toast('复制失败，请长按报告手动复制');
    });
});

function animateNum(el,target){
    var start=parseInt(el.textContent,10)||0;
    if(start===target)return;
    var dur=380,t0=null;
    function step(ts){
        if(!t0)t0=ts;
        var p=Math.min((ts-t0)/dur,1);
        var eased=1-Math.pow(1-p,3);
        el.textContent=Math.round(start+(target-start)*eased);
        if(p<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
}

/* ══════════ 回到顶部 ══════════ */
var topBtnVisible=false;
function updateTopBtn(){
    var show=window.pageYOffset>400;
    if(show!==topBtnVisible){
        topBtnVisible=show;
        btnTop.classList.toggle('visible',show);
    }
}
window.addEventListener('scroll',updateTopBtn,{ passive:true });
btnTop.addEventListener('click',function(){
    try{ window.scrollTo({ top:0, behavior:'smooth' }); }
    catch(e){ window.scrollTo(0,0); }
});

/* ══════════ 键盘快捷键 ══════════ */
document.addEventListener('keydown',function(e){
    if(e.isComposing)return;
    if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){
        var active=document.querySelector('.panel.active');
        if(!active)return;
        e.preventDefault();
        if(active.id==='pHide')btnEncode.click();
        else if(active.id==='pExtract')btnDecode.click();
        else if(active.id==='pDetect')btnDetect.click();
    }
});

})();
</script>
